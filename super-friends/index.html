<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super Friends · Super Minds 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#24327F; --sky-deep:#18225C; --sun:#FFCE3A; --paper:#FFFDF6; --ink:#1B1F3B;
  --whisper:#D9474B; --flash:#3E7C8A; --misty:#2E8B4A; --thunder:#2B9BC9;
  --font:"Andika","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  font-family:var(--font); color:var(--paper);
  background:
    radial-gradient(circle, rgba(255,255,255,.07) 1.5px, transparent 1.6px) 0 0/22px 22px,
    radial-gradient(ellipse at 50% 120%, #3446A8 0%, var(--sky) 45%, var(--sky-deep) 100%);
  background-color:var(--sky);
  display:flex; flex-direction:column; overflow:hidden;
}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}

/* tabs */
nav{display:flex;gap:10px;padding:14px 18px 0;flex-wrap:wrap}
nav button{
  border:0;border-radius:16px 16px 0 0;padding:12px 22px 14px;
  font-size:clamp(16px,1.6vw,22px);font-weight:700;
  background:rgba(255,255,255,.12);color:var(--paper);
}
nav button .n{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;
  background:rgba(255,255,255,.2);margin-right:.45em;font-size:.85em}
nav button[aria-selected="true"]{background:var(--paper);color:var(--ink)}
nav button[aria-selected="true"] .n{background:var(--sun)}

main{flex:1;position:relative;min-height:0}
section{position:absolute;inset:0;display:none;padding:18px 18px 16px}
section.on{display:flex;flex-direction:column}

.controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding-top:12px}
.btn{
  border:0;border-radius:999px;padding:14px 30px;font-size:clamp(18px,1.8vw,26px);font-weight:700;
  background:var(--sun);color:var(--ink);box-shadow:0 5px 0 #C9951A;
  transition:transform .08s, box-shadow .08s;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #C9951A}
.btn.ghost{background:rgba(255,255,255,.14);color:var(--paper);box-shadow:0 5px 0 rgba(0,0,0,.25)}
.btn[disabled]{opacity:.45;cursor:default}

/* ---------- Game 1: cards ---------- */
.board{flex:1;position:relative;min-height:0}
.slots{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);gap:2.2vw;padding:0 2vw}
.slot{min-height:0}
.card{position:absolute;top:0;left:0;perspective:1400px;transition:transform 1.1s ease-in-out;cursor:pointer;border:0;padding:0;background:none}
.card.lift{z-index:5}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.2,.2,1.2)}
.card.down .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:26px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
  box-shadow:0 10px 0 rgba(0,0,0,.25)}
.front{background:var(--paper);display:flex;flex-direction:column}
.front .pic{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;padding:6% 6% 0}
.front img{max-height:100%;max-width:100%;object-fit:contain;display:block}
.front .name{background:var(--c);color:#fff;text-align:center;font-weight:700;font-size:clamp(24px,3.4vw,54px);padding:.18em 0 .24em}
.back{transform:rotateY(180deg);display:grid;place-items:center;
  background:radial-gradient(circle, rgba(36,50,127,.16) 2px, transparent 2.2px) 0 0/16px 16px, var(--sun);
  border:6px solid var(--paper)}
.back span{font-size:clamp(90px,13vw,220px);font-weight:700;color:var(--sky);line-height:1;
  text-shadow:0 6px 0 rgba(255,255,255,.6)}
.back span.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- talk games ---------- */
.talk{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);align-items:stretch;min-height:0;gap:2vw}
.talk .hero{position:relative;min-height:0;display:flex;justify-content:center;align-items:flex-end}
.talk .hero img{height:100%;max-width:100%;object-fit:contain;object-position:bottom;cursor:pointer;
  filter:drop-shadow(0 14px 0 rgba(0,0,0,.22))}
.talk .hero img.bounce{animation:bounce .5s}
@keyframes bounce{30%{transform:translateY(-4%)}60%{transform:translateY(0)}80%{transform:translateY(-1.5%)}}
.age-badge{position:absolute;right:4%;top:6%;width:clamp(90px,10vw,160px);aspect-ratio:1;border-radius:50%;
  background:var(--sun);color:var(--sky);display:grid;place-items:center;font-weight:700;font-size:clamp(56px,7vw,110px);
  box-shadow:0 8px 0 #C9951A;transform:scale(0);transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.age-badge.show{transform:scale(1)}
.talk .right{display:flex;flex-direction:column;justify-content:center;gap:3vh;min-height:0}
.bubble{
  position:relative;background:var(--paper);color:var(--ink);border-radius:36px;padding:.55em .9em;
  font-size:clamp(30px,4.4vw,76px);font-weight:700;line-height:1.2;border:6px solid var(--c,var(--sun));
  cursor:pointer;min-height:3.2em;display:flex;flex-direction:column;justify-content:center;
}
.bubble::before{content:"";position:absolute;left:-34px;top:40%;border:18px solid transparent;border-right:30px solid var(--c,var(--sun))}
.bubble .l{display:block;opacity:0;transform:translateY(12px);transition:.35s}
.bubble .l.show{opacity:1;transform:none}
.bubble .q{color:var(--c)}
.frame{align-self:flex-start;background:rgba(255,255,255,.14);border:3px dashed rgba(255,255,255,.55);border-radius:22px;
  padding:.3em .8em;font-size:clamp(24px,3vw,48px);font-weight:700;opacity:0;transition:opacity .4s}
.frame.show{opacity:1}
.pick{display:flex;gap:14px;justify-content:center;padding-top:10px;flex-wrap:wrap}
.pick button{width:clamp(70px,7.5vw,110px);aspect-ratio:1;border-radius:50%;border:5px solid transparent;padding:0;overflow:hidden;
  background:var(--paper);position:relative}
.pick button img{position:absolute;width:118%;left:50%;top:3%;transform:translateX(-50%)}
.pick button[aria-pressed="true"]{border-color:var(--sun);box-shadow:0 0 0 5px rgba(255,206,58,.35)}
.pick button span{position:absolute;inset:auto 0 0 0;background:var(--c);color:#fff;font-size:clamp(11px,1vw,15px);font-weight:700;text-align:center;padding:1px 0 3px}

/* ---------- Game 4: superpowers ---------- */
.stage{flex:1;position:relative;min-height:0;overflow:hidden;border-radius:28px;
  background:linear-gradient(#2E3E96 0 78%, #1D2767 78% 100%)}
.actor{position:absolute;bottom:6%;height:74%;left:22%;transform:translateX(-50%)}
.actor img{height:100%;display:block;filter:drop-shadow(0 12px 0 rgba(0,0,0,.25));transition:opacity 1.4s, filter 1.4s}
.actor.run-out{transition:transform .45s cubic-bezier(.6,0,1,.6);transform:translateX(120vw)}
.actor.jump-left{transition:none;transform:translateX(-160vw)}
.actor.run-in{transition:transform .5s cubic-bezier(0,.4,.4,1);transform:translateX(-50%)}
.actor.gone img{opacity:0;filter:blur(14px) drop-shadow(0 12px 0 rgba(0,0,0,0))}
.say{position:absolute;left:44%;top:6%;max-width:52%;background:var(--paper);color:var(--ink);border:6px solid var(--c);
  border-radius:32px;padding:.4em .75em;font-size:clamp(28px,3.8vw,66px);font-weight:700;line-height:1.15;
  transform:scale(0);transform-origin:0 100%;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.say.show{transform:scale(1)}
.say::before{content:"";position:absolute;left:-30px;bottom:18px;border:14px solid transparent;border-right:26px solid var(--c)}
.animal{position:absolute;bottom:8%;font-size:clamp(90px,12vw,190px);line-height:1;transform:scale(0);transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.animal.show{transform:scale(1)}
.animal .asay{position:absolute;bottom:100%;left:50%;transform:translateX(-50%) scale(0);white-space:nowrap;background:var(--paper);
  color:var(--ink);border:5px solid var(--sun);border-radius:24px;padding:.15em .55em;font-size:clamp(24px,2.8vw,46px);font-weight:700;
  transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.animal .asay.show{transform:translateX(-50%) scale(1)}
.speedlines{position:absolute;inset:0;opacity:0;pointer-events:none;
  background:repeating-linear-gradient(0deg, transparent 0 34px, rgba(255,255,255,.55) 34px 38px, transparent 38px 90px);
  -webkit-mask:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);mask:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent)}
.speedlines.on{animation:zoom .9s linear}
@keyframes zoom{0%{opacity:0;background-position:0 0}20%{opacity:1}80%{opacity:1}100%{opacity:0;background-position:0 400px}}
.whoosh{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(0);font-size:clamp(60px,9vw,150px);font-weight:700;
  color:var(--sun);text-shadow:0 6px 0 #C9951A;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.whoosh.show{transform:translate(-50%,-50%) scale(1) rotate(-6deg)}
.sparkle{position:absolute;font-size:clamp(34px,4vw,64px);opacity:0;pointer-events:none}
.sparkle.on{animation:spark 1.6s ease-out forwards}
@keyframes spark{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(.6) translateY(-40px)}}
.car{position:absolute;font-size:clamp(90px,12vw,200px);line-height:1;left:150%;bottom:-2%;transform:translateX(-50%) scale(0);
  transition:left 1.1s cubic-bezier(.5,0,.3,1), bottom 1.1s cubic-bezier(.5,0,.3,1), transform .35s}
.car.show{transform:translateX(-50%) scale(1)}
.car.up{left:50%;bottom:90%}
.car.up.wobble{animation:wobble .5s ease-in-out 3}
@keyframes wobble{0%,100%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(-50%) rotate(-5deg)}75%{transform:translateX(-50%) rotate(5deg)}}
.stage-ctrl{position:absolute;right:22px;bottom:22px;display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}

@media (max-width:760px){
  .slots{grid-template-columns:repeat(2,1fr);gap:14px}
  .talk{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .talk .hero{order:0}
  .bubble::before{display:none}
  body{overflow:auto}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<nav role="tablist">
  <button role="tab" aria-selected="true" data-tab="g1"><span class="n">1</span>Who is it?</button>
  <button role="tab" aria-selected="false" data-tab="g2"><span class="n">2</span>What's your name?</button>
  <button role="tab" aria-selected="false" data-tab="g3"><span class="n">3</span>How old are you?</button>
  <button role="tab" aria-selected="false" data-tab="g4"><span class="n">4</span>Superpowers</button>
</nav>
<main>
  <!-- Game 1 -->
  <section id="g1" class="on">
    <div class="board" id="board"><div class="slots" id="slots"></div></div>
    <div class="controls">
      <button class="btn" id="shuffleBtn">🔀 Shuffle</button>
      <button class="btn ghost" id="openBtn">Open all</button>
    </div>
  </section>

  <!-- Game 2 -->
  <section id="g2"></section>
  <!-- Game 3 -->
  <section id="g3"></section>

  <!-- Game 4 -->
  <section id="g4">
    <div class="stage" id="stage">
      <div class="speedlines" id="lines"></div>
      <div class="actor" id="actor"><img id="actorImg" alt=""></div>
      <div class="say" id="say"></div>
      <div class="animal" id="dog" style="right:24%">🐶<div class="asay"></div></div>
      <div class="animal" id="cat" style="right:5%">🐱<div class="asay"></div></div>
      <div class="whoosh" id="whoosh">Whoosh!</div>
      <div class="stage-ctrl" id="stageCtrl"></div>
    </div>
    <div class="pick" id="pick4"></div>
  </section>
</main>

// Ages as given in Super Minds 1, Friends unit
const CH = {
  whisper:{name:"Whisper", male:true,  age:8, word:"eight", color:"var(--whisper)", pitch:1.1},
  flash:  {name:"Flash",   male:false, age:8, word:"eight", color:"var(--flash)",   pitch:1.25},

/* ---------------- Speech ---------------- */
const synth = window.speechSynthesis;
let VOICES = [];
function loadVoices(){ VOICES = synth ? synth.getVoices().filter(v=>/^en/i.test(v.lang)) : []; }
if (synth){ loadVoices(); synth.onvoiceschanged = loadVoices; }
const FEMALE = ["Samantha","Karen","Serena","Kate","Moira","Tessa","Fiona","Martha","Stephanie","Google UK English Female","Libby","Sonia","Maisie","Aria","Jenny","Zira","Hazel","Susan","Female"];
const MALE   = ["Daniel","Arthur","Oliver","Alex","Aaron","Fred","Tom","Rishi","Google UK English Male","Ryan","Thomas","Guy","David","George","Mark","Male"];
function findVoice(list){
  for (const n of list){
    const gb = VOICES.find(v=>v.name.includes(n) && /GB/i.test(v.lang)); if (gb) return gb;
    const any = VOICES.find(v=>v.name.includes(n)); if (any) return any;
  }
  return VOICES.find(v=>/GB/i.test(v.lang)) || VOICES[0] || null;
}
function speak(text, who){
  return new Promise(res=>{
    if (!synth){ setTimeout(res, 900); return; }
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    let pitch = 1, male = null;
    if (who === "dog"){ pitch = 0.6; male = true; }
    else if (who === "cat"){ pitch = 1.7; male = false; }
    else if (CH[who]){ pitch = CH[who].pitch; male = CH[who].male; }
    const v = male === null ? findVoice(["Google UK English Female","Serena","Kate","Karen","Samantha"]) : findVoice(male ? MALE : FEMALE);
    if (v){ u.voice = v; u.lang = v.lang; } else u.lang = "en-GB";
    u.pitch = pitch; u.rate = 0.82;
    let done = false; const fin = ()=>{ if(!done){done=true;res();} };
    u.onend = fin; u.onerror = fin;
    setTimeout(fin, 900 + text.length * 120);
    synth.speak(u);
  });
}
const wait = ms => new Promise(r=>setTimeout(r,ms));

/* ---------------- Tabs ---------------- */
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{
  if (synth) synth.cancel(); run4++;
  document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected", x===b));
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on", s.id===b.dataset.tab));
  if (b.dataset.tab==="g1") layout();
  if (b.dataset.tab==="g4") setActor(cur4);
}));

/* ---------------- Game 1: shuffle cards ---------------- */
const slotsEl = document.getElementById("slots"), board = document.getElementById("board");
const slots = [], cards = [];
let pos = [0,1,2,3];      // pos[card] = slot
let busy = false;
ORDER.forEach((k,i)=>{
  const s = document.createElement("div"); s.className="slot"; slotsEl.appendChild(s); slots.push(s);
  const c = document.createElement("button"); c.className="card"; c.style.setProperty("--c", CH[k].color);
  c.setAttribute("aria-label", CH[k].name);
  c.innerHTML = `<div class="inner"><div class="face front"><div class="pic"><img src="${IMG[k]}" alt=""></div><div class="name">${CH[k].name}</div></div><div class="face back"><span>?</span></div></div>`;
  c.addEventListener("click", ()=>cardClick(i));
  board.appendChild(c); cards.push(c);
});
function layout(){
  const b = board.getBoundingClientRect();
  cards.forEach((c,i)=>{
    const r = slots[pos[i]].getBoundingClientRect();
    const w = r.width, h = Math.min(r.height, w*1.55);
    c.style.width = w+"px"; c.style.height = h+"px";
    c.style.transform = `translate(${r.left-b.left}px, ${r.top-b.top + (r.height-h)/2}px)`;
  });
}
window.addEventListener("resize", layout);
async function shuffle(){
  if (busy) return; busy = true; btnState();
  cards.forEach(c=>{ c.classList.add("down"); c.querySelector(".back span").textContent="?"; });
  await wait(750);
  for (let n=0;n<6;n++){
    let a = Math.floor(Math.random()*4), b = Math.floor(Math.random()*3); if (b>=a) b++;
    const ca = pos.indexOf(a), cb = pos.indexOf(b);
    pos[ca] = b; pos[cb] = a;
    cards[ca].classList.add("lift"); cards[cb].classList.remove("lift");
    layout(); await wait(1350);
    cards[ca].classList.remove("lift");
  }
  cards.forEach((c,i)=>{ const sp = c.querySelector(".back span"); sp.textContent = pos[i]+1; sp.classList.remove("pop"); void sp.offsetWidth; sp.classList.add("pop"); });
  busy = false; btnState();
}
function cardClick(i){
  if (busy) return;
  const k = ORDER[i], c = cards[i];
  if (c.classList.contains("down")){ c.classList.remove("down"); speak(`It's ${CH[k].name}!`, k); }
  else speak(CH[k].name, k);
}
function btnState(){ document.getElementById("shuffleBtn").disabled = busy; document.getElementById("openBtn").disabled = busy; }
document.getElementById("shuffleBtn").onclick = shuffle;
document.getElementById("openBtn").onclick = ()=>{ if(!busy) cards.forEach(c=>c.classList.remove("down")); };
requestAnimationFrame(layout);
window.addEventListener("load", layout);
if (document.fonts) document.fonts.ready.then(layout);

/* ---------------- Games 2 & 3: talk ---------------- */
function buildTalk(sec, mode){
  sec.innerHTML = `
    <div class="talk">
      <div class="hero"><img alt=""><div class="age-badge"></div></div>
      <div class="right"><div class="bubble" role="button" tabindex="0"></div><div class="frame"></div></div>
    </div>
    <div class="pick"></div>`;
  const hero = sec.querySelector(".hero img"), bubble = sec.querySelector(".bubble"),
        frame = sec.querySelector(".frame"), badge = sec.querySelector(".age-badge"), pick = sec.querySelector(".pick");
  let cur = null, token = 0;
  const lines = k => mode==="name"
    ? [`Hi, I'm ${CH[k].name}.`, `What's your name?`]
    : [`I'm ${CH[k].word}.`, `How old are you?`];
  async function play(k){
    cur = k; const my = ++token; const [a,q] = lines(k);
    pick.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.k===k));
    sec.style.setProperty("--c", CH[k].color); bubble.style.setProperty("--c", CH[k].color);
    hero.src = IMG[k]; hero.alt = CH[k].name;
    hero.classList.remove("bounce"); void hero.offsetWidth; hero.classList.add("bounce");
    bubble.innerHTML = `<span class="l">${a}</span><span class="l q">${q}</span>`;
    frame.classList.remove("show"); frame.textContent = mode==="name" ? "Hi, I'm …" : "I'm …";
    badge.textContent = CH[k].age; badge.classList.remove("show");
    badge.style.display = mode==="age" ? "grid" : "none";
    const [l1,l2] = bubble.querySelectorAll(".l");
    await wait(60); if (my!==token) return;
    l1.classList.add("show"); if (mode==="age") badge.classList.add("show");
    await speak(a, k); if (my!==token) return;
    await wait(250); if (my!==token) return;
    l2.classList.add("show");
    await speak(q, k); if (my!==token) return;
    frame.classList.add("show");
  }
  ORDER.forEach(k=>{
    const b = document.createElement("button"); b.dataset.k = k; b.style.setProperty("--c", CH[k].color);
    b.setAttribute("aria-label", CH[k].name);
    b.innerHTML = `<img src="${IMG[k]}" alt=""><span>${CH[k].name}</span>`;
    b.onclick = ()=>play(k); pick.appendChild(b);
  });
  bubble.onclick = hero.onclick = ()=>cur && play(cur);
  bubble.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); cur && play(cur);} };
  // initial state without sound
  const k0 = "whisper"; cur = k0; hero.src = IMG[k0];
  sec.style.setProperty("--c", CH[k0].color); bubble.style.setProperty("--c", CH[k0].color);
  bubble.innerHTML = `<span class="l show">▶</span>`; badge.style.display="none";
  pick.querySelector("button").setAttribute("aria-pressed","true");
}
buildTalk(document.getElementById("g2"), "name");
buildTalk(document.getElementById("g3"), "age");

/* ---------------- Game 4: superpowers ---------------- */
const actor = document.getElementById("actor"), actorImg = document.getElementById("actorImg"),
      say = document.getElementById("say"), ctrl = document.getElementById("stageCtrl"),
      dog = document.getElementById("dog"), cat = document.getElementById("cat"),
      lines = document.getElementById("lines"), whoosh = document.getElementById("whoosh"),
      stage = document.getElementById("stage"), pick4 = document.getElementById("pick4");
let cur4 = "whisper", run4 = 0;
const car = document.createElement("div"); car.className="car"; car.textContent="🚗"; actor.appendChild(car);

function resetStage(){
  actor.className = "actor"; actor.style.transform = "";
  say.classList.remove("show"); whoosh.classList.remove("show"); lines.classList.remove("on");
  [dog,cat].forEach(a=>{ a.classList.remove("show"); a.querySelector(".asay").classList.remove("show"); });
  car.className = "car";
  stage.querySelectorAll(".sparkle").forEach(s=>s.remove());
}
function setActor(k){
  run4++; if (synth) synth.cancel(); cur4 = k; resetStage();
  actorImg.src = IMG[k]; actorImg.alt = CH[k].name;
  stage.style.setProperty("--c", CH[k].color);
  pick4.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.k===k));
  setCtrl([["▶ Play", ()=>SCRIPTS[k]()]]);
}
function setCtrl(list){
  ctrl.innerHTML = "";
  list.forEach(([label,fn,ghost])=>{ const b=document.createElement("button"); b.className="btn"+(ghost?" ghost":""); b.textContent=label; b.onclick=fn; ctrl.appendChild(b); });
}
async function line(text, who, id){
  if (id!==run4) throw 0;
  say.classList.remove("show"); await wait(120); say.textContent = text; say.classList.add("show");
  await speak(text, who); if (id!==run4) throw 0;
}
async function animalSay(el, text, who, id){
  if (id!==run4) throw 0;
  const s = el.querySelector(".asay"); s.textContent = text; s.classList.add("show");
  await speak(text, who); if (id!==run4) throw 0;
  s.classList.remove("show");
}
function sparkles(){
  const r = actor.getBoundingClientRect(), b = stage.getBoundingClientRect();
  for (let i=0;i<7;i++){
    const s = document.createElement("div"); s.className="sparkle"; s.textContent="✨";
    s.style.left = (r.left-b.left + Math.random()*r.width*0.9) + "px";
    s.style.top  = (r.top-b.top + Math.random()*r.height*0.8) + "px";
    s.style.animationDelay = (Math.random()*0.5)+"s";
    stage.appendChild(s); requestAnimationFrame(()=>s.classList.add("on"));
  }
}
const SCRIPTS = {
  async whisper(){
    const id = ++run4; resetStage(); setCtrl([]);
    try{
      await line("I can talk to animals!", "whisper", id);
      dog.classList.add("show"); await wait(450);
      await line("Hello, dog!", "whisper", id);
      await animalSay(dog, "Woof! Hello, Whisper!", "dog", id);
      cat.classList.add("show"); await wait(450);
      await line("Hello, cat!", "whisper", id);
      await animalSay(cat, "Meow! Hello, Whisper!", "cat", id);
      setCtrl([["↻ Again", ()=>SCRIPTS.whisper()]]);
    }catch(e){}
  },
  async flash(){
    const id = ++run4; resetStage(); setCtrl([]);
    try{
      await line("I can run fast!", "flash", id);
      say.classList.remove("show"); await wait(250);
      lines.classList.add("on");
      actor.className = "actor run-out"; await wait(470);
      whoosh.classList.add("show"); speak("Whoosh!", "flash");
      actor.className = "actor jump-left"; void actor.offsetWidth;
      await wait(420); if (id!==run4) return;
      actor.className = "actor run-in"; await wait(550);
      whoosh.classList.remove("show"); lines.classList.remove("on");
      await line("I'm fast!", "flash", id);
      setCtrl([["↻ Again", ()=>SCRIPTS.flash()]]);
    }catch(e){}
  },
  async misty(){
    const id = ++run4; resetStage(); setCtrl([]);
    try{
      await line("Look! I can be invisible!", "misty", id);
      say.classList.remove("show");
      sparkles(); actor.classList.add("gone"); await wait(1500); if (id!==run4) return;
      setCtrl([["Where's Misty?", async ()=>{
        const id2 = ++run4; setCtrl([]);
        try{
          await line("Where's Misty? I can't see her!", null, id2);
          setCtrl([["Misty, come back!", async ()=>{
            const id3 = ++run4; setCtrl([]); say.classList.remove("show");
            try{
              await speak("Misty, come back!", null); if (id3!==run4) return;
              sparkles(); actor.classList.remove("gone"); await wait(1400);
              await line("Here I am!", "misty", id3);
              setCtrl([["↻ Again", ()=>SCRIPTS.misty()]]);
            }catch(e){}
          }]]);
        }catch(e){}
      }]]);
    }catch(e){}
  },
  async thunder(){
    const id = ++run4; resetStage(); setCtrl([]);
    try{
      await line("I'm strong!", "thunder", id);
      car.classList.add("show"); await wait(500);
      await line("Look! I can lift a car!", "thunder", id);
      say.classList.remove("show");
      car.classList.add("up"); await wait(1150); if (id!==run4) return;
      car.classList.add("wobble"); await wait(300);
      await line("I'm very strong!", "thunder", id);
      setCtrl([["↻ Again", ()=>SCRIPTS.thunder()]]);
    }catch(e){}
  }
};
ORDER.forEach(k=>{
  const b = document.createElement("button"); b.dataset.k = k; b.style.setProperty("--c", CH[k].color);
  b.setAttribute("aria-label", CH[k].name);
  b.innerHTML = `<img src="${IMG[k]}" alt=""><span>${CH[k].name}</span>`;
  b.onclick = ()=>setActor(k); pick4.appendChild(b);
});
setActor("whisper");
