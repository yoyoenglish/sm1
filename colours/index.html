<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super Minds 1: Colours</title>
<style>
  :root{
    --ink:#23324A;
    --sky:#EEF7FF;
    --paper:#FFFFFF;
    --line:#C8D7E8;
    --soft:#5B6B82;
    --round:"Arial Rounded MT Bold","Arial Rounded MT","Nunito","Varela Round","Trebuchet MS",system-ui,sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{height:100%;margin:0}
  body{
    font-family:var(--round);
    color:var(--ink);
    background:
      radial-gradient(ellipse 22% 9% at 14% 18%, #fff 60%, transparent 62%),
      radial-gradient(ellipse 16% 7% at 20% 14%, #fff 60%, transparent 62%),
      radial-gradient(ellipse 20% 8% at 82% 26%, #fff 60%, transparent 62%),
      radial-gradient(ellipse 13% 6% at 88% 22%, #fff 60%, transparent 62%),
      linear-gradient(#E3F1FD, var(--sky) 55%, #F8FBFF);
    display:grid;
    grid-template-rows:auto 1fr;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:4px solid var(--ink);outline-offset:4px}

  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:clamp(8px,1.4vw,18px);justify-content:center;flex-wrap:wrap;padding:clamp(10px,2vh,22px) 12px 0}
  .tab{
    display:flex;align-items:center;gap:.55em;
    font-size:clamp(16px,1.9vw,27px);
    padding:.45em 1.1em .45em .5em;
    border-radius:999px;border:3px solid var(--ink);background:var(--paper);
  }
  .tab .num{
    display:grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;
    background:var(--ink);color:#fff;font-size:.9em;
  }
  .tab[aria-selected="true"]{background:var(--ink);color:#fff}
  .tab[aria-selected="true"] .num{background:#fff;color:var(--ink)}

  main{position:relative;min-height:0;overflow-y:auto}
  .task{display:none;height:100%;flex-direction:column;align-items:center;padding:clamp(6px,1.5vh,16px) 12px clamp(12px,3vh,28px)}
  .task.active{display:flex}

  /* ---------- controls ---------- */
  .controls{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
  .btn{
    font-size:clamp(18px,2vw,28px);
    padding:.55em 1.3em;border-radius:999px;
    border:3px solid var(--ink);background:var(--ink);color:#fff;
    display:inline-flex;align-items:center;gap:.45em;
  }
  .btn.ghost{background:var(--paper);color:var(--ink)}
  .btn:disabled{opacity:.35;cursor:default}
  .btn svg{width:1em;height:1em}

  /* ---------- balloons ---------- */
  .sky{
    flex:1;width:100%;max-width:1500px;min-height:0;
    display:flex;justify-content:space-around;align-items:flex-start;align-content:center;flex-wrap:wrap;
    padding-bottom:4vh;
  }
  .balloon{
    background:none;border:0;padding:0;
    width:clamp(92px,min(14vw,30vh),260px);
    margin-top:var(--dy,0);
    border-radius:40% 40% 45% 45%;
  }
  .balloon svg{display:block;width:100%;height:auto;overflow:visible}
  .bob{display:block;animation:bob 3.2s ease-in-out infinite alternate;animation-delay:var(--delay,0s)}
  .fx{display:block;transform-origin:50% 40%}
  @keyframes bob{from{transform:translateY(-7px) rotate(-2deg)}to{transform:translateY(7px) rotate(2deg)}}
  .fx.bounce{animation:bounce .6s cubic-bezier(.3,1.6,.5,1)}
  @keyframes bounce{0%{transform:scale(1)}35%{transform:scale(1.14) translateY(-14px)}100%{transform:scale(1)}}
  .fx.lit{animation:lit 1.4s ease-in-out}
  @keyframes lit{0%,100%{transform:scale(1)}20%,70%{transform:scale(1.22) translateY(-18px)}}
  .fx.lit svg{filter:drop-shadow(0 0 14px rgba(35,50,74,.45))}
  .fx.wiggle{animation:wiggle .45s ease-in-out}
  @keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
  .fx.popped{animation:pop .22s ease-out forwards}
  @keyframes pop{0%{transform:scale(1);opacity:1}60%{transform:scale(1.25);opacity:1}100%{transform:scale(1.45);opacity:0}}
  .enter .bob{animation:rise .55s cubic-bezier(.2,1.3,.5,1) backwards, bob 3.2s ease-in-out .55s infinite alternate}
  @keyframes rise{from{transform:translateY(60vh)}to{transform:translateY(0)}}

  .word-pop{
    position:fixed;z-index:20;pointer-events:none;transform:translate(-50%,-50%);
    font-size:clamp(34px,5vw,74px);font-weight:700;
    animation:wordUp 1.1s ease-out forwards;
  }
  @keyframes wordUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}
  .bit{position:fixed;z-index:19;width:14px;height:14px;border-radius:3px;pointer-events:none;animation:fly .8s ease-out forwards}
  @keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}

  /* ---------- task 2 ---------- */
  .stars{display:flex;gap:clamp(6px,1vw,14px);margin-bottom:4px}
  .stars svg{width:clamp(30px,3.4vw,50px);height:auto}
  .stars path{fill:#fff;stroke:var(--line);stroke-width:5;stroke-linejoin:round;transition:fill .3s}
  .stars .got path{stroke:var(--ink);animation:starIn .45s cubic-bezier(.3,1.6,.5,1)}
  @keyframes starIn{from{transform:scale(.3)}to{transform:scale(1)}}
  .stars svg path{transform-origin:50% 50%;transform-box:fill-box}
  .done{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;
    background:rgba(238,247,255,.88);z-index:5;
  }
  .done[hidden]{display:none}
  .done h2{margin:0;font-size:clamp(48px,8vw,120px);animation:bounce .8s cubic-bezier(.3,1.6,.5,1)}

  /* ---------- task 3: heroes ---------- */
  .heroes{
    flex:1;min-height:0;width:100%;max-width:1400px;
    display:flex;justify-content:space-around;align-items:flex-end;flex-wrap:wrap;gap:8px;
  }
  .hero{
    background:none;border:0;padding:0;
    display:flex;flex-direction:column;align-items:center;
    width:clamp(120px,19vw,280px);
  }
  .hero-svg{
    display:block;width:100%;height:auto;max-height:min(52vh,calc(100vh - 420px));overflow:visible;
    --suit:#FFFFFF;--cape:#EEF2F7;--mask:#FFFFFF;--boot:#FFFFFF;--splash:transparent;
  }
  .hero-svg.pow{animation:powAnim .6s cubic-bezier(.3,1.6,.5,1)}
  @keyframes powAnim{0%{transform:scale(1)}30%{transform:scale(1.12) rotate(-3deg)}60%{transform:scale(.97) rotate(2deg)}100%{transform:scale(1)}}
  .hero-svg .outl,.hero-svg .suit,.hero-svg .cape,.hero-svg .boot,.hero-svg .mask,.hero-svg .skin,.hero-svg .hair,.hero-svg .emblem{
    stroke:var(--ink);stroke-width:4;stroke-linejoin:round;
  }
  .hero-svg .suit{fill:var(--suit);transition:fill .45s}
  .hero-svg .cape{fill:var(--cape);transition:fill .45s}
  .hero-svg .boot{fill:var(--boot);transition:fill .45s}
  .hero-svg .mask{fill:var(--mask);transition:fill .45s}
  .hero-svg .limb-o{fill:none;stroke:var(--ink);stroke-width:25;stroke-linecap:round}
  .hero-svg .limb{fill:none;stroke:var(--suit);stroke-width:17;stroke-linecap:round;transition:stroke .45s}
  .hero-svg .skin{fill:#FFD9BD}
  .hero-svg .hair{fill:#3A2A24}
  .hero-svg .belt{fill:var(--ink)}
  .hero-svg .emblem{fill:#fff}
  .hero-svg .initial{fill:var(--ink);font:700 21px var(--round);text-anchor:middle}
  .hero-svg .eye{fill:var(--ink)}
  .hero-svg .glint{fill:#fff}
  .hero-svg .smile{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round}
  .hero-svg .cheek{fill:#F29BA8;opacity:.45}
  .hero-svg .splash{fill:var(--splash);opacity:0;transform-origin:100px 160px}
  .hero-svg.pow .splash{animation:splash .8s ease-out}
  @keyframes splash{0%{opacity:.5;transform:scale(.3)}100%{opacity:0;transform:scale(1.25)}}
  .hero-name{font-size:clamp(22px,2.6vw,40px);margin-top:.15em}

  .bubble{
    margin:clamp(6px,1.6vh,18px) 0;
    min-height:2.1em;max-width:min(92vw,900px);
    font-size:clamp(22px,2.8vw,42px);
    padding:.3em 1em;border-radius:1em;background:var(--paper);border:3px solid var(--ink);
    text-align:center;position:relative;
  }
  .bubble.hint{border-style:dashed;color:var(--soft)}
  .bubble.ok{animation:bounce .5s cubic-bezier(.3,1.6,.5,1)}

  .palette{display:flex;gap:clamp(6px,1vw,14px)}
  .dot{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    background:none;border:0;padding:4px;border-radius:14px;
    font-size:clamp(13px,1.2vw,18px);
  }
  .dot i{display:block;width:clamp(34px,3.6vw,54px);aspect-ratio:1;border-radius:50%;border:3px solid var(--ink)}
  .dot[aria-pressed="true"]{background:var(--paper);box-shadow:0 0 0 3px var(--ink)}

  .mic{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    background:none;border:0;padding:0;font-size:clamp(14px,1.3vw,19px);
  }
  .mic .ring{
    position:relative;display:grid;place-items:center;
    width:clamp(74px,7.5vw,110px);aspect-ratio:1;border-radius:50%;
    background:var(--ink);color:#fff;
  }
  .mic .ring svg{width:46%;height:auto}
  .mic.on .ring::before,.mic.on .ring::after{
    content:"";position:absolute;inset:-4px;border-radius:50%;border:4px solid var(--ink);
    animation:ping 1.6s ease-out infinite;
  }
  .mic.on .ring::after{animation-delay:.8s}
  @keyframes ping{from{transform:scale(1);opacity:.7}to{transform:scale(1.6);opacity:0}}
  .note{min-height:1.3em;margin:.5em 0 0;font-size:clamp(14px,1.3vw,19px);color:#9A2A1E;text-align:center;max-width:900px}

  @media (max-width:640px){
    .tab{padding:.4em .8em .4em .4em}
    .task{height:auto;min-height:100%}
    .heroes{flex:none}
    .hero{width:44vw}
    .hero-svg{max-height:27vh}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>

<nav class="tabs" role="tablist" aria-label="Tasks">
  <button class="tab" role="tab" aria-selected="true" data-task="1"><span class="num">1</span>Listen and point</button>
  <button class="tab" role="tab" aria-selected="false" data-task="2"><span class="num">2</span>Listen and pop</button>
  <button class="tab" role="tab" aria-selected="false" data-task="3"><span class="num">3</span>Say and colour</button>
</nav>

<main>
  <!-- Task 1 -->
  <section class="task active" id="task1" role="tabpanel">
    <div class="sky" id="sky1"></div>
    <div class="controls">
      <button class="btn" id="play1"><svg viewBox="0 0 20 20"><path d="M5 3l12 7-12 7z" fill="currentColor"/></svg><span>Play</span></button>
    </div>
  </section>

  <!-- Task 2 -->
  <section class="task" id="task2" role="tabpanel">
    <div class="stars" id="stars"></div>
    <div class="sky" id="sky2"></div>
    <div class="controls">
      <button class="btn" id="start2"><svg viewBox="0 0 20 20"><path d="M5 3l12 7-12 7z" fill="currentColor"/></svg><span>Start</span></button>
      <button class="btn ghost" id="again2" disabled><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z" fill="currentColor"/></svg><span>Again</span></button>
    </div>
    <div class="done" id="done2" hidden>
      <h2>Well done!</h2>
      <div class="stars" id="doneStars"></div>
      <button class="btn" id="replay2">Play again</button>
    </div>
  </section>

  <!-- Task 3 -->
  <section class="task" id="task3" role="tabpanel">
    <div class="heroes" id="heroes"></div>
    <div class="bubble hint" id="heard" aria-live="polite">Say: Thunder is blue.</div>
    <div class="controls">
      <div class="palette" id="palette"></div>
      <button class="mic" id="mic" aria-pressed="false">
        <span class="ring"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 0 0-7 0v6A3.5 3.5 0 0 0 12 15zm6-3.5a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.9V22h2v-2.6a8 8 0 0 0 7-7.9h-2z"/></svg></span>
        <span id="micLabel">Tap and speak</span>
      </button>
      <button class="btn ghost" id="clear3">Clear</button>
    </div>
    <p class="note" id="note3"></p>
  </section>
</main>

<script>
(() => {
  /* ======================= data ======================= */
  const COLORS = [
    {id:'yellow', main:'#FBD431', dark:'#C29A06', light:'#FFF3AE'},
    {id:'red',    main:'#E8412C', dark:'#A92A18', light:'#FF9C8A'},
    {id:'orange', main:'#F7962F', dark:'#C4680C', light:'#FFCF93'},
    {id:'purple', main:'#7D50AA', dark:'#51307A', light:'#BDA0DE'},
    {id:'green',  main:'#40AE4B', dark:'#23772F', light:'#A3E2A9'},
    {id:'blue',   main:'#1FA3DE', dark:'#116FA0', light:'#92D8F6'}
  ];
  const C = Object.fromEntries(COLORS.map(c => [c.id, c]));
  const HEROES = [
    {id:'whisper', name:'Whisper', hair:'bob'},
    {id:'flash',   name:'Flash',   hair:'spiky'},
    {id:'misty',   name:'Misty',   hair:'pony'},
    {id:'thunder', name:'Thunder', hair:'curly'}
  ];
  // Words the recogniser often returns instead of the target word (children's / L1-Russian accents)
  const HERO_ALIASES = {
    whisper:['whisper','whispers','whispered','whispering','wisper','whispa','vesper','whisker'],
    flash:['flash','flesh','flush','flask','flashes','flashed'],
    misty:['misty','missy','misti','mistie','mistee','mysty','mysti','masti','mistea','misstea','missti','misst'],
    thunder:['thunder','thunders','sunder','tunder','tander','thander','funder','thunda']
  };
  const COLOR_ALIASES = {
    red:['red','read','redd','wred','rad','reds'],
    blue:['blue','blew','blues','bloo','blu'],
    green:['green','greens','grin','grean','queen','grain'],
    yellow:['yellow','yellows','yello','hello','jello','yella','yellowe'],
    orange:['orange','oranges','orang','orenge','arrange','orinj'],
    purple:['purple','purples','purpel','pupil','people','pople','purpl']
  };
  const heroMap = {}, colorMap = {};
  for (const [k, list] of Object.entries(HERO_ALIASES)) list.forEach(w => heroMap[w] = k);
  for (const [k, list] of Object.entries(COLOR_ALIASES)) list.forEach(w => colorMap[w] = k);

  const $ = s => document.querySelector(s);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const retrigger = (el, cls) => { el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls); };

  /* ======================= speech out ======================= */
  let voice = null, speakToken = 0, muteUntil = 0;
  function pickVoice(){
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices();
    if (!vs.length) return;
    const pref = ['Google UK English Female','Kate','Serena','Martha','Stephanie','Daniel','Arthur','Google UK English Male'];
    voice = pref.map(n => vs.find(v => v.name.includes(n) && /^en/i.test(v.lang))).find(Boolean)
      || vs.find(v => /^en[-_]GB/i.test(v.lang))
      || vs.find(v => /^en[-_]US/i.test(v.lang))
      || vs.find(v => /^en/i.test(v.lang)) || null;
  }
  if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

  function speak(text, rate = 0.82){
    return new Promise(resolve => {
      if (!('speechSynthesis' in window)) return resolve();
      const token = ++speakToken;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if (voice){ u.voice = voice; u.lang = voice.lang; } else u.lang = 'en-GB';
      u.rate = rate; u.pitch = 1.05;
      let finished = false;
      const fin = () => {
        if (finished) return; finished = true;
        if (token === speakToken) muteUntil = Date.now() + 1300;
        resolve();
      };
      u.onend = fin; u.onerror = fin;
      muteUntil = Date.now() + 15000;
      setTimeout(fin, 1800 + text.length * 110);
      speechSynthesis.speak(u);
    });
  }
  function stopSpeech(){ speakToken++; if ('speechSynthesis' in window) speechSynthesis.cancel(); muteUntil = Date.now() + 400; }

  /* ======================= sound fx ======================= */
  let ac = null;
  function audio(){ if (!ac){ const A = window.AudioContext || window.webkitAudioContext; if (A) ac = new A(); } if (ac && ac.state === 'suspended') ac.resume(); return ac; }
  function tone(freq, t0, dur, type = 'sine', vol = .18, freqEnd){
    const a = audio(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, a.currentTime + t0);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, a.currentTime + t0 + dur);
    g.gain.setValueAtTime(0.0001, a.currentTime + t0);
    g.gain.exponentialRampToValueAtTime(vol, a.currentTime + t0 + .015);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + t0 + dur);
    o.connect(g).connect(a.destination); o.start(a.currentTime + t0); o.stop(a.currentTime + t0 + dur + .02);
  }
  function popSound(){
    const a = audio(); if (!a) return;
    const len = Math.floor(a.sampleRate * .12), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = buf; f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = .7; g.gain.value = .9;
    s.connect(f).connect(g).connect(a.destination); s.start();
    tone(520, 0, .09, 'sine', .15, 180);
  }
  const yesSound = () => { tone(660, 0, .13); tone(990, .11, .2); };
  const noSound  = () => { tone(240, 0, .22, 'triangle', .14, 170); };
  const magicSound = () => { tone(500, 0, .28, 'sine', .12, 1300); tone(1300, .22, .2, 'sine', .08, 1700); };

  /* ======================= drawing ======================= */
  function balloonSVG(c, withWord){
    const gid = 'g-' + c.id + '-' + Math.random().toString(36).slice(2, 7);
    const fs = c.id.length > 4 ? 33 : 40;
    return `<svg viewBox="0 0 160 262" aria-hidden="true">
      <defs><radialGradient id="${gid}" cx="36%" cy="30%" r="75%">
        <stop offset="0" stop-color="${c.light}"/><stop offset=".45" stop-color="${c.main}"/><stop offset="1" stop-color="${c.dark}"/>
      </radialGradient></defs>
      <path d="M80 198 C70 214 93 230 79 258" fill="none" stroke="#23324A" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M73 199 L80 188 L87 199 Z" fill="${c.dark}"/>
      <path d="M80 8 C128 8 152 46 152 94 C152 146 112 186 80 191 C48 186 8 146 8 94 C8 46 32 8 80 8 Z" fill="url(#${gid})"/>
      <ellipse cx="54" cy="52" rx="17" ry="11" fill="#fff" opacity=".55" transform="rotate(-32 54 52)"/>
      ${withWord ? `<text x="80" y="${fs > 36 ? 108 : 106}" text-anchor="middle" font-family='"Arial Rounded MT Bold","Arial Rounded MT","Nunito","Trebuchet MS",sans-serif' font-weight="700" font-size="${fs}"
        fill="#fff" stroke="${c.dark}" stroke-width="7" stroke-linejoin="round" paint-order="stroke">${c.id}</text>` : ''}
    </svg>`;
  }

  const HAIR = {
    spiky: `<path class="hair" d="M62 72 L64 50 L76 57 L80 36 L92 50 L100 30 L108 50 L120 36 L124 57 L136 50 L138 72 Q118 54 100 56 Q82 54 62 72 Z"/>`,
    bob:   `<path class="hair" d="M58 94 Q50 38 100 36 Q150 38 142 94 L132 92 Q131 60 100 58 Q69 60 68 92 Z"/>`,
    pony:  `<path class="hair" d="M62 75 Q61 38 100 38 Q139 38 138 75 Q122 56 100 58 Q78 56 62 75 Z"/>`,
    curly: [[64,72],[67,55],[79,43],[93,37],[107,37],[121,43],[133,55],[136,72]].map(([x,y]) => `<circle class="hair" cx="${x}" cy="${y}" r="11"/>`).join('')
  };
  function heroSVG(h){
    return `<svg class="hero-svg" viewBox="0 0 200 276" aria-hidden="true">
      <circle class="splash" cx="100" cy="160" r="96"/>
      ${h.hair === 'pony' ? '<path class="hair" d="M130 56 Q170 62 162 120 Q152 96 128 86 Z"/>' : ''}
      <path class="cape" d="M72 122 Q100 112 128 122 L164 266 Q146 256 128 266 Q110 256 100 266 Q90 256 72 266 Q54 256 36 266 Z"/>
      <path class="suit" d="M80 204 L78 256 L98 256 L99 208 Z"/>
      <path class="suit" d="M101 208 L102 256 L122 256 L120 204 Z"/>
      <rect class="boot" x="70" y="248" width="30" height="20" rx="8"/>
      <rect class="boot" x="100" y="248" width="30" height="20" rx="8"/>
      <path class="limb-o" d="M78 132 Q54 152 68 178"/><path class="limb" d="M78 132 Q54 152 68 178"/>
      <circle class="skin" cx="70" cy="181" r="10"/>
      <path class="limb-o" d="M122 132 Q148 114 150 82"/><path class="limb" d="M122 132 Q148 114 150 82"/>
      <circle class="skin" cx="150" cy="75" r="11"/>
      <path class="suit" d="M72 126 Q100 114 128 126 L124 212 Q100 218 76 212 Z"/>
      <rect class="belt" x="75" y="194" width="50" height="11" rx="4"/>
      <circle class="emblem" cx="100" cy="158" r="17"/>
      <text class="initial" x="100" y="165.5">${h.name[0]}</text>
      <rect class="skin" x="92" y="106" width="16" height="16" rx="4"/>
      <circle class="skin" cx="100" cy="76" r="38"/>
      ${HAIR[h.hair]}
      <path class="mask" d="M62 72 Q100 58 138 72 Q140 88 121 91 Q108 84 100 86 Q92 84 79 91 Q60 88 62 72 Z"/>
      <ellipse class="eye" cx="84" cy="77" rx="5.5" ry="7"/><ellipse class="eye" cx="116" cy="77" rx="5.5" ry="7"/>
      <circle class="glint" cx="86" cy="74" r="2"/><circle class="glint" cx="118" cy="74" r="2"/>
      <path class="smile" d="M87 99 Q100 111 113 99"/>
      <circle class="cheek" cx="75" cy="99" r="6"/><circle class="cheek" cx="125" cy="99" r="6"/>
    </svg>`;
  }
  const STAR = '<svg viewBox="0 0 50 48"><path d="M25 3l6.5 13.6 14.9 2-10.9 10.3 2.7 14.8L25 36.6 11.8 43.7l2.7-14.8L3.6 18.6l14.9-2z"/></svg>';

  const OFFSETS = ['9vh','0vh','6.5vh','0.5vh','8vh','1.5vh'];
  function renderBalloons(host, list, withWord, enter){
    host.innerHTML = list.map((c, i) => `
      <button class="balloon${enter ? ' enter' : ''}" data-c="${c.id}" aria-label="${withWord ? c.id : 'balloon'}"
        style="--dy:${OFFSETS[i % 6]};--delay:${(i * .37).toFixed(2)}s">
        <span class="bob"><span class="fx">${balloonSVG(c, withWord)}</span></span>
      </button>`).join('');
  }
  function burst(el, color){
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height * .36;
    for (let i = 0; i < 14; i++){
      const b = document.createElement('span');
      b.className = 'bit';
      const ang = Math.PI * 2 * i / 14 + Math.random() * .4, dist = 70 + Math.random() * 90;
      b.style.cssText = `left:${cx - 7}px;top:${cy - 7}px;background:${i % 3 ? color.main : color.dark};--x:${Math.cos(ang) * dist}px;--y:${Math.sin(ang) * dist}px;--r:${Math.random() * 360}deg`;
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 900);
    }
    const w = document.createElement('span');
    w.className = 'word-pop'; w.textContent = color.id; w.style.color = color.dark;
    w.style.left = cx + 'px'; w.style.top = cy + 'px';
    document.body.appendChild(w);
    setTimeout(() => w.remove(), 1200);
  }

  /* ======================= tabs ======================= */
  const tabs = [...document.querySelectorAll('.tab')];
  tabs.forEach(t => t.addEventListener('click', () => {
    const n = t.dataset.task;
    tabs.forEach(x => x.setAttribute('aria-selected', x === t ? 'true' : 'false'));
    document.querySelectorAll('.task').forEach(s => s.classList.toggle('active', s.id === 'task' + n));
    stopTask1(); stopTask2(); micOff(); stopSpeech();
  }));

  /* ======================= task 1: listen and point ======================= */
  const sky1 = $('#sky1'), play1 = $('#play1');
  renderBalloons(sky1, COLORS, true, false);
  sky1.addEventListener('click', e => {
    const b = e.target.closest('.balloon'); if (!b) return;
    audio();
    retrigger(b.querySelector('.fx'), 'bounce');
    speak(b.dataset.c);
  });
  let run1 = 0;
  function setPlay1(on){ play1.querySelector('span').textContent = on ? 'Stop' : 'Play';
    play1.querySelector('svg').innerHTML = on ? '<rect x="4" y="4" width="12" height="12" rx="2" fill="currentColor"/>' : '<path d="M5 3l12 7-12 7z" fill="currentColor"/>'; }
  function stopTask1(){ run1++; setPlay1(false); sky1.querySelectorAll('.fx.lit').forEach(f => f.classList.remove('lit')); }
  play1.addEventListener('click', async () => {
    if (play1.querySelector('span').textContent === 'Stop'){ stopTask1(); stopSpeech(); return; }
    const my = ++run1; setPlay1(true); audio();
    for (const c of shuffle(COLORS.slice())){
      if (my !== run1) return;
      await speak(c.id);
      await wait(2300); if (my !== run1) return;
      const fx = sky1.querySelector(`[data-c="${c.id}"] .fx`);
      retrigger(fx, 'lit'); speak(c.id);
      await wait(1600); if (my !== run1) return;
      fx.classList.remove('lit');
      await wait(450);
    }
    if (my === run1) stopTask1();
  });

  /* ======================= task 2: listen and pop ======================= */
  const sky2 = $('#sky2'), stars = $('#stars'), start2 = $('#start2'), again2 = $('#again2'), done2 = $('#done2');
  let order2 = [], idx2 = 0, target2 = null, busy2 = false, playing2 = false, got2 = [];
  function drawStars(host){ host.innerHTML = COLORS.map((_, i) => STAR).join('');
    [...host.children].forEach((s, i) => { if (got2[i]){ s.classList.add('got'); s.querySelector('path').style.fill = got2[i].main; } }); }
  function layout2(enter){ renderBalloons(sky2, shuffle(COLORS.slice()), false, enter); }
  layout2(false); drawStars(stars);

  function stopTask2(){ playing2 = false; busy2 = false; target2 = null; again2.disabled = true; start2.disabled = false; }
  async function nextRound(){
    if (!playing2) return;
    if (idx2 >= order2.length){
      playing2 = false; again2.disabled = true; start2.disabled = false;
      drawStars($('#doneStars')); done2.hidden = false; yesSound(); speak('Well done!');
      return;
    }
    target2 = order2[idx2]; busy2 = false;
    await speak(target2.id);
  }
  function startGame(){
    audio(); done2.hidden = true;
    order2 = shuffle(COLORS.slice()); idx2 = 0; got2 = []; drawStars(stars);
    playing2 = true; start2.disabled = true; again2.disabled = false;
    layout2(true);
    setTimeout(nextRound, 650);
  }
  start2.addEventListener('click', startGame);
  $('#replay2').addEventListener('click', startGame);
  again2.addEventListener('click', () => { if (target2) speak(target2.id); });
  sky2.addEventListener('click', async e => {
    const b = e.target.closest('.balloon'); if (!b) return;
    audio();
    const fx = b.querySelector('.fx');
    if (!playing2){ retrigger(fx, 'bounce'); speak(b.dataset.c); return; }
    if (busy2 || !target2) return;
    if (b.dataset.c === target2.id){
      busy2 = true;
      const c = target2;
      popSound(); fx.classList.add('popped'); burst(b, c);
      got2[idx2] = c; drawStars(stars);
      setTimeout(yesSound, 150);
      await wait(250); await speak(c.id);
      idx2++; target2 = null;
      await wait(500);
      if (!playing2) return;
      layout2(true);
      setTimeout(nextRound, 600);
    } else {
      retrigger(fx, 'wiggle'); noSound();
      busy2 = true; await wait(450); busy2 = false;
      if (target2) speak(target2.id);
    }
  });

  /* ======================= task 3: say and colour ======================= */
  const heroesEl = $('#heroes'), heard = $('#heard'), note3 = $('#note3'), micBtn = $('#mic'), micLabel = $('#micLabel');
  heroesEl.innerHTML = HEROES.map(h => `
    <button class="hero" data-h="${h.id}" aria-label="${h.name}">
      ${heroSVG(h)}
      <span class="hero-name">${h.name}</span>
    </button>`).join('');
  $('#palette').innerHTML = COLORS.map(c => `<button class="dot" data-c="${c.id}" aria-pressed="false"><i style="background:${c.main}"></i>${c.id}</button>`).join('');

  const lastApplied = {};
  function colourHero(heroId, colorId, say){
    const h = HEROES.find(x => x.id === heroId), c = C[colorId];
    if (!h || !c) return;
    const prev = lastApplied[heroId];
    const svg = heroesEl.querySelector(`[data-h="${heroId}"] .hero-svg`);
    // echo guard: the page's own voice ("Thunder is blue.") must not re-trigger itself through the microphone
    if (say === 'voice' && prev && prev.color === colorId && Date.now() - prev.t < 6000){ retrigger(svg, 'pow'); return; }
    lastApplied[heroId] = {color: colorId, t: Date.now()};
    svg.style.setProperty('--suit', c.main);
    svg.style.setProperty('--cape', c.dark);
    svg.style.setProperty('--mask', c.dark);
    svg.style.setProperty('--boot', c.dark);
    svg.style.setProperty('--splash', c.main);
    retrigger(svg, 'pow');
    magicSound();
    setTimeout(() => speak(`${h.name} is ${c.id}.`), 250);
  }
  function resetHeroes(){
    heroesEl.querySelectorAll('.hero-svg').forEach(s => ['--suit','--cape','--mask','--boot','--splash'].forEach(p => s.style.removeProperty(p)));
    for (const k in lastApplied) delete lastApplied[k];
  }
  $('#clear3').addEventListener('click', () => { resetHeroes(); setHeard('Say: Thunder is blue.', 'hint'); });

  // tap fallback: colour dot, then hero
  let pick = null;
  $('#palette').addEventListener('click', e => {
    const d = e.target.closest('.dot'); if (!d) return;
    audio();
    pick = pick === d.dataset.c ? null : d.dataset.c;
    document.querySelectorAll('.dot').forEach(x => x.setAttribute('aria-pressed', x.dataset.c === pick ? 'true' : 'false'));
    if (pick) speak(pick);
  });
  heroesEl.addEventListener('click', e => {
    const b = e.target.closest('.hero'); if (!b) return;
    audio();
    const h = HEROES.find(x => x.id === b.dataset.h);
    if (pick){ colourHero(h.id, pick, 'tap'); setHeard(`${h.name} is ${pick}.`, 'ok'); }
    else speak(h.name);
  });

  function setHeard(text, mode){
    heard.textContent = text;
    heard.classList.toggle('hint', mode === 'hint');
    if (mode === 'ok') retrigger(heard, 'ok'); else heard.classList.remove('ok');
  }

  // "Thunder is blue", "Thunder's blue", "Misty is purple and Flash is red"
  function tokens(text){
    return text.toLowerCase().replace(/[’']s\b/g, ' is').replace(/[^a-z\s]/g, ' ').split(/\s+/).filter(Boolean);
  }
  function parsePairs(text){
    const t = tokens(text), out = [];
    let hero = null;
    for (let i = 0; i < t.length; i++){
      const two = t[i] + (t[i + 1] || '');
      if (heroMap[t[i]]){ hero = heroMap[t[i]]; continue; }
      if (t[i + 1] && heroMap[two]){ hero = heroMap[two]; i++; continue; }
      if (hero && colorMap[t[i]]){ out.push({hero, color: colorMap[t[i]]}); hero = null; }
    }
    return out;
  }
  window.__parsePairs = parsePairs; // used for self-test only

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, micOn = false, session = 0;
  const handled = new Map();

  function handleTranscripts(alternatives, key, isFinal){
    const shown = alternatives[0] || '';
    if (Date.now() < muteUntil) return;
    if (shown.trim()) setHeard('“' + shown.trim() + '”', null);
    for (const alt of alternatives){
      const pairs = parsePairs(alt);
      if (!pairs.length) continue;
      const done = handled.get(key) || new Set();
      let changed = false;
      for (const p of pairs){
        const k = p.hero + ':' + p.color;
        if (done.has(k)) continue;
        done.add(k); changed = true;
        colourHero(p.hero, p.color, 'voice');
      }
      handled.set(key, done);
      if (changed){
        const p = pairs[pairs.length - 1];
        setHeard(`${HEROES.find(h => h.id === p.hero).name} is ${p.color}.`, 'ok');
      }
      return;
    }
  }
  window.__handleTranscripts = handleTranscripts; // used for self-test only

  function startRec(){
    session++;
    const mySession = session;
    rec = new SR();
    rec.lang = 'en-GB';
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 5;
    rec.onresult = e => {
      for (let i = e.resultIndex; i < e.results.length; i++){
        const r = e.results[i], alts = [];
        for (let a = 0; a < r.length; a++) alts.push(r[a].transcript);
        handleTranscripts(alts, mySession + ':' + i, r.isFinal);
      }
    };
    rec.onerror = e => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        note3.textContent = 'Нет доступа к микрофону. Разрешите микрофон для этой страницы (значок в адресной строке) или откройте файл в Chrome / Safari по ссылке https. Пока можно раскрашивать нажатием: цвет → герой.';
        micOff();
      } else if (e.error === 'audio-capture'){
        note3.textContent = 'Микрофон не найден. Проверьте, что он подключён и выбран в системе.';
        micOff();
      } else if (e.error === 'network'){
        note3.textContent = 'Распознавание речи не отвечает: нужен интернет (Chrome отправляет звук на свой сервер распознавания).';
        micOff();
      }
    };
    rec.onend = () => { if (micOn && mySession === session) setTimeout(() => { if (micOn) { try { startRec(); } catch(_){} } }, 250); };
    try { rec.start(); } catch(_){}
  }
  function micOnFn(){
    if (!SR){
      note3.textContent = 'В этом браузере нет распознавания речи. Откройте тренажёр в Chrome или Safari. Пока можно раскрашивать нажатием: цвет → герой.';
      return;
    }
    audio();
    note3.textContent = '';
    micOn = true; micBtn.classList.add('on'); micBtn.setAttribute('aria-pressed', 'true'); micLabel.textContent = 'Listening…';
    setHeard('Say: Thunder is blue.', 'hint');
    startRec();
  }
  function micOff(){
    micOn = false; session++;
    if (rec){ try { rec.abort(); } catch(_){} rec = null; }
    micBtn.classList.remove('on'); micBtn.setAttribute('aria-pressed', 'false'); micLabel.textContent = 'Tap and speak';
  }
  micBtn.addEventListener('click', () => micOn ? micOff() : micOnFn());
})();
</script>
