<style>
:root{
  color-scheme: light;
  --paper:#F5F9FF; --grid:#D5E5F5; --ink:#22306B; --ink-soft:#5B6A9E;
  --good:#16A86A; --bad:#E5484D; --gold:#FFB400;
  --u: min(1vh, 0.75vw);
  --font: "Grandstander", "Trebuchet MS", "Verdana", system-ui, sans-serif;
  --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  font-family:var(--font); color:var(--ink);
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: calc(var(--u)*4) calc(var(--u)*4);
  display:flex; flex-direction:column; overflow:hidden;
  -webkit-tap-highlight-color: transparent; user-select:none; -webkit-user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline: calc(var(--u)*0.6) solid var(--gold); outline-offset: calc(var(--u)*0.5)}
[hidden]{display:none !important}

/* top bar */
.bar{
  flex:0 0 auto; display:flex; align-items:center; gap:calc(var(--u)*2);
  padding: calc(var(--u)*1.6) calc(var(--u)*3);
  min-height: calc(var(--u)*10);
}
.brand{font-weight:900; font-size:calc(var(--u)*3.6); letter-spacing:.01em}
.chip{
  background:#fff; border:calc(var(--u)*.4) solid var(--ink); border-radius:calc(var(--u)*3);
  padding: calc(var(--u)*.8) calc(var(--u)*2.2); font-weight:800; font-size:calc(var(--u)*2.8);
  box-shadow:0 calc(var(--u)*.6) 0 var(--ink); transition:transform .08s, box-shadow .08s;
}
.chip:active{transform:translateY(calc(var(--u)*.6)); box-shadow:0 0 0 var(--ink)}
.track{list-style:none; margin:0 0 0 auto; padding:0; display:flex; gap:calc(var(--u)*1)}
.track li{
  width:calc(var(--u)*4.2); height:calc(var(--u)*4.2); border-radius:50%;
  border:calc(var(--u)*.4) dashed var(--ink-soft); display:grid; place-items:center;
  font-size:calc(var(--u)*3); line-height:1; font-family:var(--emoji);
}
.track li.now{border-style:solid; border-color:var(--ink); background:#fff}
.track li.star{border:0}
.track li.star::after{content:"⭐"}
.track li.miss{border:0; background:#C9D3E6}

main{flex:1 1 auto; position:relative; display:flex; min-height:0}
.screen{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:calc(var(--u)*3); padding: calc(var(--u)*1) calc(var(--u)*3) calc(var(--u)*3)}

/* numeral look shared by hero, card, options */
.num{
  font-weight:900; line-height:1; color:var(--c);
  text-shadow: .05em .06em 0 var(--ink);
  -webkit-text-stroke: .018em var(--ink);
  paint-order: stroke fill;
}

/* home */
.hero-title{margin:0; font-weight:900; font-size:calc(var(--u)*11); line-height:1; letter-spacing:-.01em}
.hero-row{display:grid; grid-template-columns:repeat(10, minmax(0,1fr)); gap:min(1vw, 1.4vh); width:min(94vw, 150vh)}
.hero-row button{
  aspect-ratio:1/1; min-width:0; padding:0; background:#fff; border:calc(var(--u)*.45) solid var(--ink);
  border-radius:22%; display:grid; place-items:center;
  font-size:min(7.2vw, 11vh);
  box-shadow:0 calc(var(--u)*.8) 0 var(--ink);
}
.hero-row button .num{transform:translateY(-.03em)}
.hero-row button.pop{animation:pop .45s ease}
.hint{margin:0; font-weight:600; font-size:calc(var(--u)*3); color:var(--ink-soft)}
.modes{display:flex; gap:calc(var(--u)*3); flex-wrap:wrap; justify-content:center}
.mode{
  display:flex; flex-direction:column; align-items:center; gap:calc(var(--u)*.6);
  width:calc(var(--u)*24); padding:calc(var(--u)*2) calc(var(--u)*1.5) calc(var(--u)*1.6);
  background:var(--bg); border:calc(var(--u)*.5) solid var(--ink); border-radius:calc(var(--u)*3.5);
  font-weight:900; font-size:calc(var(--u)*4.4); color:#fff;
  text-shadow: 0 calc(var(--u)*.3) 0 rgba(34,48,107,.55);
  box-shadow:0 calc(var(--u)*1) 0 var(--ink); transition:transform .08s, box-shadow .08s;
}
.mode:active{transform:translateY(calc(var(--u)*1)); box-shadow:0 0 0 var(--ink)}
.mode .mi{font-family:var(--emoji); font-size:calc(var(--u)*8); line-height:1.1; text-shadow:none}
.mode[data-mode="learn"]{--bg:#3A6FE3}
.mode[data-mode="listen"]{--bg:#D546B0}
.mode[data-mode="count"]{--bg:#16A86A}

/* intro bounce: the one orchestrated moment */
@media (prefers-reduced-motion: no-preference){
  .hero-row.intro button{animation:drop .6s cubic-bezier(.3,1.6,.5,1) both; animation-delay:calc(var(--i)*70ms)}
}
@keyframes drop{from{transform:translateY(-60%) scale(.6); opacity:0} to{transform:none; opacity:1}}
@keyframes pop{0%{transform:scale(1)} 40%{transform:scale(1.14)} 100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)} 20%{transform:translateX(-8%)} 40%{transform:translateX(7%)} 60%{transform:translateX(-5%)} 80%{transform:translateX(3%)}}

/* learn */
.learn-main{display:flex; align-items:center; gap:calc(var(--u)*3)}
.nav{
  width:calc(var(--u)*11); height:calc(var(--u)*11); border-radius:50%;
  background:#fff; border:calc(var(--u)*.5) solid var(--ink); box-shadow:0 calc(var(--u)*.8) 0 var(--ink);
  font-weight:900; font-size:calc(var(--u)*7); line-height:1; display:grid; place-items:center; padding-bottom:calc(var(--u)*1);
}
.nav:active{transform:translateY(calc(var(--u)*.8)); box-shadow:none}
.card{
  position:relative; width:calc(var(--u)*52); padding:calc(var(--u)*2.5) calc(var(--u)*3) calc(var(--u)*3);
  background:#fff; border:calc(var(--u)*.6) solid var(--ink); border-radius:calc(var(--u)*4);
  box-shadow:0 calc(var(--u)*1.2) 0 var(--ink);
  display:flex; flex-direction:column; align-items:center; gap:calc(var(--u)*1.2);
}
.card.pop{animation:pop .4s ease}
.card .num{font-size:calc(var(--u)*28)}
.card-word{font-weight:800; font-size:calc(var(--u)*6.5); line-height:1}
.card-sound{position:absolute; top:calc(var(--u)*1.6); right:calc(var(--u)*2); font-family:var(--emoji); font-size:calc(var(--u)*4.4)}
.frame{
  display:grid; grid-template-columns:repeat(5, calc(var(--u)*6.6)); grid-template-rows:repeat(2, calc(var(--u)*6.6));
  border:calc(var(--u)*.45) solid var(--ink); border-radius:calc(var(--u)*1); overflow:hidden; background:#fff;
}
.frame i{border-right:calc(var(--u)*.3) solid var(--ink); border-bottom:calc(var(--u)*.3) solid var(--ink); display:grid; place-items:center}
.frame i:nth-child(5n){border-right:0}
.frame i:nth-child(n+6){border-bottom:0}
.frame i b{width:72%; height:72%; border-radius:50%; background:var(--c); border:calc(var(--u)*.35) solid var(--ink)}
@media (prefers-reduced-motion: no-preference){ .frame i b{animation:pop .35s ease both; animation-delay:calc(var(--i)*45ms)} }
.strip{display:flex; gap:calc(var(--u)*1.2)}
.strip button{
  padding:0; width:calc(var(--u)*7); height:calc(var(--u)*7); border-radius:calc(var(--u)*1.6);
  background:#fff; border:calc(var(--u)*.4) solid var(--ink-soft); font-size:calc(var(--u)*5.2);
}
.strip button[aria-current="true"]{border-color:var(--ink); border-width:calc(var(--u)*.6); transform:translateY(calc(var(--u)*-.8)); box-shadow:0 calc(var(--u)*.8) 0 var(--ink)}
.action{
  background:var(--gold); border:calc(var(--u)*.5) solid var(--ink); border-radius:calc(var(--u)*3);
  padding:calc(var(--u)*1.2) calc(var(--u)*3.4); font-weight:900; font-size:calc(var(--u)*3.6);
  box-shadow:0 calc(var(--u)*.8) 0 var(--ink);
}
.action:active{transform:translateY(calc(var(--u)*.8)); box-shadow:none}

/* game */
.prompt{position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(var(--u)*1.5)}
.listen-btn{
  width:calc(var(--u)*30); height:calc(var(--u)*30); border-radius:50%;
  background:#D546B0; border:calc(var(--u)*.7) solid var(--ink); box-shadow:0 calc(var(--u)*1.4) 0 var(--ink);
  font-family:var(--emoji); font-size:calc(var(--u)*14); line-height:1; display:grid; place-items:center;
}
.listen-btn:active{transform:translateY(calc(var(--u)*1.4)); box-shadow:none}
.listen-btn.talking{animation:pulse .9s ease infinite}
@keyframes pulse{0%,100%{transform:scale(1)} 50%{transform:scale(1.06)}}
@media (prefers-reduced-motion: reduce){ .listen-btn.talking{animation:none} }
.prompt-text{margin:0; font-weight:800; font-size:calc(var(--u)*4.4)}
[data-mode="count"] .listen-btn{
  position:absolute; left:calc(var(--u)*-2); top:calc(var(--u)*-2); z-index:2;
  width:calc(var(--u)*10); height:calc(var(--u)*10); font-size:calc(var(--u)*5); background:#16A86A;
  box-shadow:0 calc(var(--u)*.7) 0 var(--ink); border-width:calc(var(--u)*.5);
}
.things{
  display:grid; grid-template-columns:repeat(5, calc(var(--u)*15)); grid-template-rows:repeat(3, calc(var(--u)*13));
  background:#fff; border:calc(var(--u)*.6) solid var(--ink); border-radius:calc(var(--u)*4);
  box-shadow:0 calc(var(--u)*1.2) 0 var(--ink); padding:calc(var(--u)*1) calc(var(--u)*2);
}
.thing{position:relative; display:grid; place-items:center}
.thing span{font-family:var(--emoji); font-size:calc(var(--u)*9); line-height:1; transform:rotate(var(--r)) translate(var(--dx), var(--dy)); transition:transform .2s}
.thing em{
  position:absolute; top:4%; right:10%; font-style:normal; font-weight:900; font-size:calc(var(--u)*3.4);
  min-width:calc(var(--u)*5); height:calc(var(--u)*5); border-radius:50%; display:none; place-items:center;
  background:var(--gold); border:calc(var(--u)*.35) solid var(--ink); line-height:1;
}
.thing.counted span{transform:rotate(0) scale(1.18)}
.thing.counted em{display:grid}
.feedback{min-height:calc(var(--u)*7); display:flex; align-items:center; justify-content:center; gap:calc(var(--u)*1.6);
  font-weight:900; font-size:calc(var(--u)*5); line-height:1}
.feedback .num{font-size:calc(var(--u)*8)}
.feedback.ok{color:var(--good)}
.feedback.no{color:var(--bad)}
.options{display:grid; grid-template-columns:repeat(4, calc(var(--u)*25)); gap:calc(var(--u)*3)}
.opt{
  aspect-ratio:1/1; padding:0; min-width:0; background:#fff; border:calc(var(--u)*.6) solid var(--ink); border-radius:calc(var(--u)*4);
  box-shadow:0 calc(var(--u)*1.2) 0 var(--ink); display:grid; place-items:center;
  font-size:calc(var(--u)*20); transition:transform .08s, box-shadow .08s, background .2s, opacity .2s;
}
.opt:active{transform:translateY(calc(var(--u)*1.2)); box-shadow:none}
.opt.right{background:#DDF7EA; border-color:var(--good); animation:pop .45s ease}
.opt.wrong{animation:shake .45s ease; opacity:.35}
.opt:disabled{cursor:default}

/* end */
.end-title{margin:0; font-weight:900; font-size:calc(var(--u)*11)}
.end-stars{display:flex; flex-wrap:wrap; justify-content:center; max-width:92vw; gap:calc(var(--u)*1.2); font-family:var(--emoji); font-size:calc(var(--u)*6.5)}
.end-stars .miss{filter:grayscale(1); opacity:.3}
.score{margin:0; font-weight:900; font-size:calc(var(--u)*6)}
.end-actions{display:flex; gap:calc(var(--u)*3)}
.end-actions .chip{font-size:calc(var(--u)*4); padding:calc(var(--u)*1.4) calc(var(--u)*3.4)}

.voice-note{margin:0; font-weight:600; font-size:calc(var(--u)*2.6); color:var(--bad)}

/* two-digit numeral (10) inside square tiles */
.num.two{letter-spacing:-.06em}
.hero-row .num.two, .strip .num.two, .opt .num.two{font-size:.8em}

#confetti{position:fixed; inset:0; pointer-events:none; z-index:10}

/* portrait phones and tablets */
@media (orientation: portrait){
  :root{--u: min(0.72vh, 1.25vw)}
  .hero-row{grid-template-columns:repeat(5, minmax(0,1fr)); width:min(92vw, 60vh)}
  .things{grid-template-columns:repeat(5, calc(var(--u)*12.5)); grid-template-rows:repeat(3, calc(var(--u)*12)); padding:calc(var(--u)*1)}
  .thing span{font-size:calc(var(--u)*8)}
  .hero-row button{font-size:min(14vw, 9vh)}
  .options{grid-template-columns:repeat(2, calc(var(--u)*30))}
  .opt{font-size:calc(var(--u)*24)}
  .learn-main{gap:calc(var(--u)*1.5)}
  .card{width:calc(var(--u)*50)}
  .nav{width:calc(var(--u)*9); height:calc(var(--u)*9); font-size:calc(var(--u)*5.5)}
  .strip{flex-wrap:wrap; justify-content:center; max-width:calc(var(--u)*45)}
  .track li{width:calc(var(--u)*3.6); height:calc(var(--u)*3.6); font-size:calc(var(--u)*2.6)}
  .brand{font-size:calc(var(--u)*3.2)}
  .mode{width:calc(var(--u)*22)}
  .end-stars{display:grid; grid-template-columns:repeat(5, auto); font-size:calc(var(--u)*7)}
  .end-title{font-size:calc(var(--u)*10)}
}
</style>
</head>
<body>
<header class="bar">
  <button class="chip" id="homeBtn" hidden aria-label="Home"><span style="font-family:var(--emoji)">🏠</span> Home</button>
  <div class="brand" id="brand" hidden>Numbers 1–10</div>
  <ol class="track" id="track" hidden aria-label="Progress"></ol>
</header>

<main>
  <!-- HOME -->
  <section class="screen" id="home">
    <h1 class="hero-title">Numbers</h1>
    <div class="hero-row intro" id="heroRow"></div>
    <p class="hint">Tap a number to hear it</p>
    <div class="modes">
      <button class="mode" data-mode="learn"><span class="mi">📖</span>Learn</button>
      <button class="mode" data-mode="listen"><span class="mi">👂</span>Listen</button>
      <button class="mode" data-mode="count"><span class="mi">🍎</span>Count</button>
    </div>
    <p class="voice-note" id="voiceNote" hidden>No English voice on this device. Say the numbers aloud!</p>
  </section>

  <!-- LEARN -->
  <section class="screen" id="learn" hidden>
    <div class="learn-main">
      <button class="nav" id="prev" aria-label="Previous number">‹</button>
      <button class="card" id="card" aria-label="Hear the number">
        <span class="card-sound" aria-hidden="true">🔊</span>
        <span class="num" id="cardNum">1</span>
        <span class="card-word" id="cardWord">one</span>
        <span class="frame" id="frame" aria-hidden="true"></span>
      </button>
      <button class="nav" id="next" aria-label="Next number">›</button>
    </div>
    <div class="strip" id="strip"></div>
    <button class="action" id="sayAll">▶ Say 1 to 10</button>
  </section>

  <!-- LISTEN / COUNT -->
  <section class="screen" id="game" hidden>
    <div class="prompt">
      <button class="listen-btn" id="listenBtn" aria-label="Listen again">🔊</button>
      <p class="prompt-text" id="promptText">Listen and tap!</p>
      <div class="things" id="things" aria-hidden="true"></div>
    </div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div class="options" id="options"></div>
  </section>

  <!-- END -->
  <section class="screen" id="end" hidden>
    <h2 class="end-title" id="endTitle">Well done!</h2>
    <div class="end-stars" id="endStars"></div>
    <p class="score" id="score"></p>
    <div class="end-actions">
      <button class="chip" id="again">Play again</button>
      <button class="chip" id="endHome">Home</button>
    </div>
  </section>
</main>

<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(function(){
"use strict";

var WORDS  = ["one","two","three","four","five","six","seven","eight","nine","ten"];
var COLORS = ["#F2453D","#FF8B17","#F5B800","#7CC62A","#10A56B","#12AFC4","#3A6FE3","#7A4FE0","#D546B0","#B5651D"];
var THINGS = ["🍎","🎈","🐟","🚗","⭐","🐤","🍌","🐞","🌸","⚽","🍓","🐸"];
var ROUND = 10;

function $(id){ return document.getElementById(id); }
function range(a,b){ var r=[]; for(var i=a;i<=b;i++) r.push(i); return r; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function numSpan(n){ var s=document.createElement("span"); s.className = n===10 ? "num two" : "num"; s.style.setProperty("--c", COLORS[n-1]); s.textContent=n; return s; }
var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- "generation": any screen change cancels pending callbacks ---------- */
var gen = 0;
function later(fn, ms){ var g=gen; return setTimeout(function(){ if(g===gen) fn(); }, ms); }

/* ---------- speech (Web Speech API, British English voice preferred) ---------- */
var synth = ("speechSynthesis" in window) ? window.speechSynthesis : null;
var voice = null;
var PREFERRED = ["Google UK English Female","Daniel","Serena","Kate","Martha","Arthur","Stephanie","Microsoft Libby","Microsoft Sonia","Microsoft Hazel","Google UK English Male"];
function pickVoice(){
  if(!synth) return;
  var vs = synth.getVoices() || [];
  if(!vs.length) return;
  voice = null;
  for(var i=0;i<PREFERRED.length && !voice;i++){
    for(var j=0;j<vs.length;j++){
      if(vs[j].name.indexOf(PREFERRED[i])!==-1 && /^en/i.test(vs[j].lang)){ voice=vs[j]; break; }
    }
  }
  if(!voice){
    voice = vs.find(function(v){return /^en[-_]GB/i.test(v.lang);}) ||
            vs.find(function(v){return /^en[-_](US|AU|IE|NZ)/i.test(v.lang);}) ||
            vs.find(function(v){return /^en/i.test(v.lang);}) || null;
  }
  $("voiceNote").hidden = !!voice;
}
if(synth){
  pickVoice();
  if(synth.addEventListener) synth.addEventListener("voiceschanged", pickVoice);
  else synth.onvoiceschanged = pickVoice;
  setTimeout(function(){ if(!voice) $("voiceNote").hidden = false; }, 2500);
}else{
  $("voiceNote").hidden = false;
}

/* say(text, done?, {minMs, rate}) — done() fires once speech ends (or after a safety timeout) */
function say(text, done, opts){
  opts = opts || {};
  var g = gen, finished = false, start = Date.now(), safety;
  var lb = $("listenBtn");
  function fin(){
    if(finished) return; finished = true; clearTimeout(safety);
    lb.classList.remove("talking");
    var wait = Math.max(0, (opts.minMs||0) - (Date.now()-start));
    setTimeout(function(){ if(done && g===gen) done(); }, wait);
  }
  safety = setTimeout(fin, 1600 + text.length*90);
  if(!synth){ fin(); return; }
  var u = new SpeechSynthesisUtterance(text);
  if(voice){ u.voice = voice; u.lang = voice.lang; } else { u.lang = "en-GB"; }
  u.rate = opts.rate || 0.85; u.pitch = 1.05;
  u.onend = fin; u.onerror = fin;
  lb.classList.add("talking");
  function go(){ try{ synth.speak(u); }catch(e){ fin(); } }
  if(synth.speaking || synth.pending){ synth.cancel(); setTimeout(go, 60); } else { go(); }
}
function hush(){ if(synth){ try{ synth.cancel(); }catch(e){} } $("listenBtn").classList.remove("talking"); }

/* ---------- little sound effects (Web Audio) ---------- */
var ac = null;
function tones(freqs, dur, type, vol){
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if(ac.state === "suspended") ac.resume();
    var t = ac.currentTime + 0.01;
    freqs.forEach(function(f,i){
      var o = ac.createOscillator(), gnode = ac.createGain();
      o.type = type; o.frequency.value = f;
      var s = t + i*dur;
      gnode.gain.setValueAtTime(0.0001, s);
      gnode.gain.exponentialRampToValueAtTime(vol, s+0.02);
      gnode.gain.exponentialRampToValueAtTime(0.0001, s+dur);
      o.connect(gnode); gnode.connect(ac.destination);
      o.start(s); o.stop(s+dur+0.03);
    });
  }catch(e){}
}
function chime(){ tones([660,880,1320], 0.11, "triangle", 0.18); }
function buzz(){ tones([196,165], 0.15, "square", 0.05); }

/* unlock audio on the first touch (needed on iPhone/iPad) */
document.addEventListener("pointerdown", function unlock(){
  document.removeEventListener("pointerdown", unlock);
  try{ ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if(ac.state==="suspended") ac.resume(); }catch(e){}
  if(synth){ try{ var u=new SpeechSynthesisUtterance(" "); u.volume=0; synth.speak(u); }catch(e){} }
});

/* ---------- screens ---------- */
var screens = ["home","learn","game","end"];
function show(id){
  gen++; hush();
  screens.forEach(function(s){ $(s).hidden = (s!==id); });
  $("homeBtn").hidden = (id==="home" || id==="end");
  $("brand").hidden = (id==="home") || (id==="game" && window.innerWidth < 700);
  $("track").hidden = (id!=="game");
}

/* ---------- HOME ---------- */
var heroRow = $("heroRow");
range(1,10).forEach(function(n){
  var b = document.createElement("button");
  b.style.setProperty("--i", n-1);
  b.setAttribute("aria-label", WORDS[n-1]);
  b.appendChild(numSpan(n));
  b.addEventListener("click", function(){
    b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
    say(WORDS[n-1]);
  });
  heroRow.appendChild(b);
});
setTimeout(function(){ heroRow.classList.remove("intro"); }, 1500);

document.querySelectorAll(".mode").forEach(function(b){
  b.addEventListener("click", function(){
    var m = b.getAttribute("data-mode");
    if(m==="learn") openLearn(); else startGame(m);
  });
});
$("homeBtn").addEventListener("click", function(){ stopSayAll(); show("home"); });
$("endHome").addEventListener("click", function(){ show("home"); });

/* ---------- LEARN ---------- */
var learnN = 1, sayingAll = false;
var strip = $("strip");
range(1,10).forEach(function(n){
  var b = document.createElement("button");
  b.setAttribute("aria-label", WORDS[n-1]);
  b.appendChild(numSpan(n));
  b.addEventListener("click", function(){ stopSayAll(); showCard(n, true); });
  strip.appendChild(b);
});
function renderFrame(n){
  var f = $("frame"); f.innerHTML = "";
  for(var i=0;i<10;i++){
    var cell = document.createElement("i");
    if(i<n){ var dot=document.createElement("b"); dot.style.setProperty("--i", i); cell.appendChild(dot); }
    f.appendChild(cell);
  }
}
function showCard(n, speak){
  learnN = n;
  var card = $("card");
  card.style.setProperty("--c", COLORS[n-1]);
  var cn = $("cardNum"); cn.style.setProperty("--c", COLORS[n-1]); cn.textContent = n;
  $("cardWord").textContent = WORDS[n-1];
  card.setAttribute("aria-label", "Hear: " + WORDS[n-1]);
  renderFrame(n);
  strip.querySelectorAll("button").forEach(function(b,i){ b.setAttribute("aria-current", i===n-1 ? "true" : "false"); });
  card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop");
  if(speak) say(WORDS[n-1]);
}
function openLearn(){ show("learn"); showCard(1, true); }
$("card").addEventListener("click", function(){ stopSayAll(); showCard(learnN, true); });
$("prev").addEventListener("click", function(){ stopSayAll(); showCard(learnN===1 ? 10 : learnN-1, true); });
$("next").addEventListener("click", function(){ stopSayAll(); showCard(learnN===10 ? 1 : learnN+1, true); });

function stopSayAll(){
  if(!sayingAll) return;
  sayingAll = false; gen++; hush();
  $("sayAll").textContent = "▶ Say 1 to 10";
}
$("sayAll").addEventListener("click", function(){
  if(sayingAll){ stopSayAll(); return; }
  sayingAll = true; gen++;
  $("sayAll").textContent = "■ Stop";
  (function step(n){
    if(!sayingAll) return;
    showCard(n, false);
    say(WORDS[n-1], function(){
      if(n<10) step(n+1);
      else { sayingAll = false; $("sayAll").textContent = "▶ Say 1 to 10"; }
    }, {minMs: 900});
  })(1);
});

/* ---------- LISTEN & COUNT ---------- */
var mode = "listen", order = [], idx = 0, results = [], target = 1, firstTry = true, locked = false, lastThing = "";

function renderTrack(){
  var t = $("track"); t.innerHTML = "";
  for(var i=0;i<ROUND;i++){
    var li = document.createElement("li");
    if(results[i]===true) li.className = "star";
    else if(results[i]===false) li.className = "miss";
    else if(i===idx) li.className = "now";
    t.appendChild(li);
  }
}

function startGame(m){
  mode = m;
  show("game");
  $("game").setAttribute("data-mode", m);
  $("promptText").hidden = (m!=="listen");
  $("things").hidden = (m!=="count");
  $("listenBtn").setAttribute("aria-label", m==="listen" ? "Listen again" : "How many?");
  order = shuffle(range(1,10)); idx = 0; results = [];
  nextQuestion();
}

function nextQuestion(){
  if(idx >= ROUND){ endGame(); return; }
  target = order[idx]; firstTry = true; locked = false;
  var fb = $("feedback"); fb.className = "feedback"; fb.innerHTML = "";
  renderTrack();

  var others = shuffle(range(1,10).filter(function(x){ return x!==target; })).slice(0,3);
  var opts = shuffle(others.concat([target]));
  var box = $("options"); box.innerHTML = "";
  opts.forEach(function(n){
    var b = document.createElement("button");
    b.className = "opt"; b.setAttribute("aria-label", WORDS[n-1]);
    b.appendChild(numSpan(n));
    b.addEventListener("click", function(){ answer(n, b); });
    box.appendChild(b);
  });

  if(mode === "count"){
    renderThings(target);
    later(function(){ say("How many?"); }, 400);
  }else{
    later(function(){ say(WORDS[target-1]); }, 400);
  }
}

function renderThings(n){
  var th; do{ th = THINGS[Math.floor(Math.random()*THINGS.length)]; }while(th===lastThing);
  lastThing = th;
  var cells = shuffle(range(1,14)).slice(0,n) /* cell 0 sits under the sound button */.sort(function(a,b){return a-b;});
  var box = $("things"); box.innerHTML = "";
  for(var c=0;c<15;c++){
    var d = document.createElement("div"); d.className = "thing";
    if(cells.indexOf(c)!==-1){
      var s = document.createElement("span"); s.textContent = th;
      s.style.setProperty("--r", (Math.random()*30-15).toFixed(0)+"deg");
      s.style.setProperty("--dx", (Math.random()*16-8).toFixed(0)+"%");
      s.style.setProperty("--dy", (Math.random()*12-6).toFixed(0)+"%");
      d.appendChild(s);
      d.appendChild(document.createElement("em"));
      d.setAttribute("data-obj","1");
    }
    box.appendChild(d);
  }
}

function answer(n, btn){
  if(locked) return;
  var fb = $("feedback");
  if(n === target){
    locked = true;
    results[idx] = firstTry;
    btn.classList.add("right");
    $("options").querySelectorAll(".opt").forEach(function(b){ b.disabled = true; });
    chime();
    renderTrack();
    fb.className = "feedback ok";
    fb.innerHTML = "";
    fb.appendChild(document.createTextNode(firstTry ? "Great!" : "Yes!"));

    var finish = function(){
      fb.appendChild(numSpan(target));
      fb.appendChild(document.createTextNode(WORDS[target-1]));
      say(WORDS[target-1], function(){ later(function(){ idx++; nextQuestion(); }, 700); }, {minMs: 800});
    };

    if(mode === "count"){
      var objs = $("things").querySelectorAll('[data-obj="1"]');
      (function countStep(i){
        if(i >= objs.length){ later(finish, 250); return; }
        objs[i].classList.add("counted");
        objs[i].querySelector("em").textContent = i+1;
        say(WORDS[i], function(){ countStep(i+1); }, {minMs: 520, rate: 0.95});
      })(0);
    }else{
      later(finish, 250);
    }
  }else{
    firstTry = false;
    btn.classList.add("wrong"); btn.disabled = true;
    buzz();
    fb.className = "feedback no"; fb.textContent = "Try again!";
    if(mode === "listen"){
      say("Try again!", function(){ later(function(){ say(WORDS[target-1]); }, 250); });
    }else{
      say("Try again!");
    }
  }
}

$("listenBtn").addEventListener("click", function(){
  if(locked) return;
  say(mode === "listen" ? WORDS[target-1] : "How many?");
});

function endGame(){
  show("end");
  var got = results.filter(function(r){ return r===true; }).length;
  var stars = $("endStars"); stars.innerHTML = "";
  results.forEach(function(r){
    var s = document.createElement("span"); s.textContent = "⭐";
    if(!r) s.className = "miss";
    stars.appendChild(s);
  });
  $("score").textContent = got + " / " + ROUND;
  $("endTitle").textContent = got >= 8 ? "Well done!" : "Good job!";
  later(function(){ say(got >= 8 ? "Well done!" : "Good job!"); }, 300);
  confetti();
}
$("again").addEventListener("click", function(){ startGame(mode); });

/* ---------- confetti ---------- */
function confetti(){
  if(reduceMotion) return;
  var cv = $("confetti"), ctx = cv.getContext("2d");
  var W = cv.width = window.innerWidth, H = cv.height = window.innerHeight;
  var ps = [];
  for(var i=0;i<140;i++){
    ps.push({x: W/2 + (Math.random()-.5)*W*.3, y: H*.35, vx:(Math.random()-.5)*16, vy: -Math.random()*14-4,
             s: 6+Math.random()*10, r: Math.random()*6, vr:(Math.random()-.5)*.3, c: COLORS[i%10]});
  }
  var t0 = performance.now(), g = gen;
  (function frame(t){
    if(g !== gen){ ctx.clearRect(0,0,W,H); return; }
    ctx.clearRect(0,0,W,H);
    ps.forEach(function(p){
      p.vy += .45; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      ctx.fillRect(-p.s/2, -p.s/3, p.s, p.s*.66); ctx.restore();
    });
    if(t - t0 < 2600) requestAnimationFrame(frame); else ctx.clearRect(0,0,W,H);
  })(t0);
}

})();
</script>
