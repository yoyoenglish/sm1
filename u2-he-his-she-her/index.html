<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SM1 · He, She, His, Her, I, My</title>
<style>
:root{--m:#2374e1;--mb:#dcebff;--f:#e0457f;--fb:#ffe1ec;--i:#1f9d61;--ib:#dcf5e7;--y:#ffd43b;--ink:#22303f;--bg:#fffdf5;--card:#fff;--line:#e8e2cf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--y);box-shadow:0 2px 0 #e6bd22}
header h1{flex:1;margin:0;font-size:20px;text-align:center}
#home{font-size:24px;border:0;background:#fff;border-radius:14px;width:48px;height:48px;cursor:pointer}
#stars{font-weight:800;background:#fff;border-radius:14px;padding:10px 12px;min-width:70px;text-align:center}
main{max-width:760px;margin:0 auto;padding:16px 14px 60px}
button{font:inherit;color:inherit;cursor:pointer}
b.m{color:var(--m)} b.f{color:var(--f)} b.i{color:var(--i)}
.hint{color:#6b7480;font-size:16px;text-align:center;margin:4px 0 14px}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.menu button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 8px;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;font-weight:800;font-size:18px}
.menu button span{font-size:40px}
.menu button small{font-weight:500;color:#6b7480;font-size:14px}
.menu button:active,.opt:active,.tile:active,.ph:active{transform:translateY(2px)}
.rule{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}
.rule div{border-radius:16px;padding:10px 6px;text-align:center;font-weight:800;font-size:20px}
.rule small{display:block;font-weight:600;font-size:13px;color:#4a5562;margin-top:2px}
.rule .rm{background:var(--mb)} .rule .rf{background:var(--fb)} .rule .ri{background:var(--ib)}
.rule .em{font-size:30px;display:block}
/* flashcards */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.fc{perspective:900px;height:210px}
.fc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;border:2px solid var(--line);border-bottom-width:5px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;text-align:center}
.fc .back{transform:rotateY(180deg)}
.fc .w{font-size:42px;font-weight:900;line-height:1}
.fc .pic{display:flex;align-items:center;gap:4px;font-size:38px}
.fc .ex{font-size:22px;font-weight:800}
.fc .tr{min-height:26px;font-size:20px;font-weight:700;color:#4a5562}
.row2{display:flex;gap:8px;align-items:center}
.snd,.ru{border:0;border-radius:50%;width:44px;height:44px;font-size:20px;background:var(--y);font-weight:900}
.ru{font-size:14px;background:#eef1f4;width:38px;height:38px}
.playing{outline:4px solid var(--y);outline-offset:2px}
/* scene */
.scene{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 14px;flex-wrap:wrap}
.who{display:flex;flex-direction:column;align-items:center;font-weight:900;font-size:22px}
.badge{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;border:2px solid var(--line);border-radius:18px;width:84px;height:84px;font-size:44px;font-weight:900}
.badge small{font-size:12px;font-weight:600;color:#6b7480}
.say{position:relative;background:#fff;border:3px solid var(--i);border-radius:20px;padding:12px 16px;font-size:26px;font-weight:800;max-width:100%}
.say:before{content:"";position:absolute;left:-14px;top:50%;margin-top:-10px;border:10px solid transparent;border-right-color:var(--i);border-left:0}
.sent{font-size:30px;font-weight:800;text-align:center;margin:10px 0 16px;line-height:1.3}
.gap{display:inline-block;min-width:74px;border-bottom:4px dashed #b9c0c8;text-align:center;color:#b9c0c8}
.opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.opt{min-width:120px;padding:14px 18px;font-size:26px;font-weight:900;background:#fff;border:2px solid var(--line);border-bottom-width:5px;border-radius:18px}
.opt:disabled{opacity:.35}
.opt.ok{background:#d9f7e3;border-color:#33b56f;opacity:1}
.optrow{display:flex;gap:8px;align-items:center;margin:8px 0}
.optrow .opt{flex:1;text-align:left;font-size:22px}
.fbk{margin:16px 0 0;padding:12px 14px;border-radius:16px;font-weight:700;font-size:18px;text-align:center}
.fbk.ok{background:#d9f7e3} .fbk.no{background:#ffe3e0}
.next{display:block;margin:14px auto 0;padding:14px 30px;font-size:22px;font-weight:900;border:0;border-radius:18px;background:var(--y);box-shadow:0 4px 0 #e6bd22}
.prog{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.prog i{width:22px;height:8px;border-radius:4px;background:#e6e1d0}
.prog i.d{background:#33b56f} .prog i.c{background:var(--y)}
/* phrases */
.pick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.pick button{border:3px solid transparent;border-radius:50%;padding:0;background:none;line-height:0}
.pick button.on{border-color:var(--y)}
.blk{background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px;margin:12px 0}
.blk h3{margin:0 0 8px;font-size:18px}
.phrow{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.ph{flex:1;min-width:200px;text-align:left;padding:10px 14px;font-size:22px;font-weight:800;background:#fafafa;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px}
.ph.q{background:#fff8d9}
.ph:before{content:"🔊 ";font-size:16px}
.trn{flex-basis:100%;color:#4a5562;font-size:16px;font-weight:600;padding-left:6px}
.all{display:block;margin:10px auto 0;padding:10px 18px;border:0;border-radius:14px;background:var(--y);font-weight:800}
/* build */
.line{min-height:70px;border:3px dashed #cfd5db;border-radius:18px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:10px 0 16px;background:#fff}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:60px}
.tile{padding:10px 14px;font-size:24px;font-weight:800;background:#fff;border:2px solid var(--line);border-bottom-width:5px;border-radius:14px}
.end{text-align:center;padding:30px 10px}
.end .big{font-size:64px}
.end p{font-size:26px;font-weight:900;margin:8px 0 18px}
.end button{margin:6px}
@media(min-width:620px){.menu{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

// --- 2. look and listen
function phrow(key,text,ru,q){const r=h(`<div class="phrow"><button class="ph ${q?'q':''}">${col(text)}</button><button class="ru">RU</button></div>`);
 r.firstChild.onclick=()=>play(key,r.firstChild);r.lastChild.onclick=()=>{if(!r.querySelector('.trn'))r.append(h(`<div class="trn">${ru}</div>`))};return r}
function look(sel){stop();setT('Смотри и слушай');const k=sel&&sel.id?sel:KIDS[0];
 app.innerHTML='<p class="hint">Выбери друга. Нажимай на фразы и слушай.</p><div class="pick"></div>'+scene(k);
 KIDS.forEach(x=>{const b=h(`<button class="${x===k?'on':''}" aria-label="${x.N}">${av(x,56)}</button>`);b.onclick=()=>look(x);app.querySelector('.pick').append(b)});
 const b1=h(`<div class="blk"><h3>👉 Мы говорим про ${k.N}: ${M(k)?'<b class="m">he · his</b>':'<b class="f">she · her</b>'}</h3></div>`),seq1=[];
 ['name','age','toy'].forEach(t=>{b1.append(phrow(`q_${t}_${k.g}`,QT[t](k.g),QR[t](k.g),1),phrow(`${k.id}_${t}`,T(k,t),R(k,t)));seq1.push(`q_${t}_${k.g}`,`${k.id}_${t}`)});
 const a1=h('<button class="all">▶ Слушать всё</button>');a1.onclick=()=>play(seq1,a1);b1.append(a1);
 const b2=h(`<div class="blk"><h3>🙋 ${k.N} говорит о себе: <b class="i">I · my</b></h3></div>`),seq2=[];
 ['iam','myname','iage','mytoy'].forEach(t=>{b2.append(phrow(`${k.id}_${t}`,T(k,t),R(k,t)));seq2.push(`${k.id}_${t}`)});
 const a2=h('<button class="all">▶ Слушать всё</button>');a2.onclick=()=>play(seq2,a2);b2.append(a2);
 app.append(b1,b2)}
// --- game engine
function game(title,make,draw){stop();setT(title);const rounds=make();let i=0,score=0;
 const step=()=>{stop();if(i>=rounds.length)return fin();app.innerHTML=`<div class="prog">${rounds.map((_,j)=>`<i class="${j<i?'d':j===i?'c':''}"></i>`).join('')}</div><div class="round"></div>`;
  const box=app.lastChild;let first=true,done=false;
  const say=(m,ok)=>{let f=box.querySelector('.fbk');if(!f){f=h('<div class="fbk"></div>');box.append(f)}f.className='fbk '+(ok?'ok':'no');f.textContent=m};
  draw(rounds[i],box,{wrong(m){if(done)return;first=false;tone(false);say('✗ '+m,false);setTimeout(()=>{if(!done)play('fb_no')},300)},
   right(m,keys){if(done)return;done=true;tone(true);if(first){score++;total++;upd()}say('✓ '+m,true);const n=h('<button class="next">Дальше ➜</button>');n.onclick=()=>{i++;step()};box.append(n);setTimeout(()=>play(keys),450)}})};
 const fin=()=>{const n=rounds.length;app.innerHTML=`<div class="end"><div class="big">${score>=n-1?'🏆':score>=n/2?'🌟':'💪'}</div><p>${score} из ${n}</p><div class="hint">${score>=n-1?'Отлично! Ты всё понял.':score>=n/2?'Хорошо! Попробуй ещё раз — получится лучше.':'Послушай «Смотри и слушай» и попробуй ещё раз.'}</div><button class="next" id="ag">Ещё раз 🔁</button><button class="next" id="mn">Меню 🏠</button></div>`;
  app.querySelector('#ag').onclick=()=>game(title,make,draw);app.querySelector('#mn').onclick=menu;play(score>=n-1?'fb_1':score>=n/2?'fb_3':'fb_2')};
 step()}
// --- 3/4. gap games
const WHY=(w,k)=>({"He's":`He's — «он». ${k.N} — мальчик.`,"She's":`She's — «она». ${k.N} — девочка.`,"His":`His — «его» (чей?). ${k.N} — мальчик.`,"Her":`Her — «её» (чья?). ${k.N} — девочка.`,"I'm":`I'm — «я». ${k.N} говорит о себе.`,"My":`My — «мой, моя». ${k.N} говорит о своём.`})[w];
function gapItem(k,t,hard){const m=M(k),full=T(k,t);let ans,opts,bubble=false;
 if(t==='age'){ans=m?"He's":"She's";opts=hard?[ans,m?'His':'Her',m?"She's":"He's"]:["He's","She's"]}
 else if(t==='name'||t==='short'){ans=m?'His':'Her';opts=hard?[ans,m?"He's":"She's",m?'Her':'His']:['His','Her']}
 else{bubble=true;ans=(t==='iam'||t==='iage')?"I'm":'My';opts=["I'm",'My']}
 return {k,ans,opts:shuf(opts),bubble,text:full.replace(ans,'___'),full,audio:`${k.id}_${t}`,why:WHY(ans,k)+' '+full+' — '+R(k,t)}}
const cyc=(types,hard)=>()=>{const ks=shuf(KIDS);return types.map((t,i)=>gapItem(ks[i%6],t,hard))};
const roundsA=cyc(['age','name','short','name','age','short','age','name'],false);
const roundsB=cyc(['age','name','iam','myname','name','iage','age','mytoy','name','myname'],true);
function drawGap(r,box,api){const g='<span class="gap">?</span>',t=r.text.replace('___',g);
 box.innerHTML=(r.bubble?`<p class="hint">${r.k.N} говорит о себе. Какое слово нужно?</p>`:`<p class="hint">Мы говорим про ${r.k.N}. Какое слово нужно?</p>`)+scene(r.k,r.bubble?`<div class="say">${t}</div>`:'')+(r.bubble?'':`<div class="sent">${t}</div>`)+'<div class="opts"></div>';
 r.opts.forEach(o=>{const b=h(`<button class="opt">${col(o)}</button>`);b.onclick=()=>{if(o===r.ans){box.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.classList.add('ok');box.querySelector('.gap').outerHTML=col(o);api.right('Верно! '+r.why,[r.audio])}else{b.disabled=true;api.wrong('Не так. '+WHY(r.ans,r.k)+' Попробуй ещё раз.')}};box.querySelector('.opts').append(b)})}
// --- 5. question → answer
const roundsQ=()=>{const ks=shuf(KIDS),ts=['name','age','toy','age','toy','name','toy','name'];return ts.map((t,i)=>({k:ks[i%6],t}))};
function drawQ(r,box,api){const k=r.k,qk=`q_${r.t}_${k.g}`;
 box.innerHTML='<p class="hint">Послушай вопрос. Нажми 🔊, чтобы услышать ответы. Выбери правильный.</p>'+scene(k)+`<div class="phrow"><button class="ph q">${col(QT[r.t](k.g))}</button></div><div class="os"></div>`;
 const qb=box.querySelector('.ph');qb.onclick=()=>play(qk,qb);setTimeout(()=>play(qk,qb),350);
 shuf(['name','age','toy']).forEach(t=>{const row=h(`<div class="optrow"><button class="snd" aria-label="слушать">🔊</button><button class="opt">${col(T(k,t))}</button></div>`),[s,b]=row.children;
  s.onclick=()=>play(`${k.id}_${t}`,s);
  b.onclick=()=>{if(t===r.t){box.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.classList.add('ok');api.right(`Верно! ${QT[r.t](k.g)} — «${QR[r.t](k.g)}» ${T(k,t)} — ${R(k,t)}`,[qk,`${k.id}_${t}`])}else{b.disabled=true;api.wrong(`Не так. Вопрос: «${QR[r.t](k.g)}» А это ответ: «${R(k,t)}» Попробуй ещё раз.`)}};
  box.querySelector('.os').append(row)})}
// --- 6. build
const roundsBuild=()=>{const ks=shuf(KIDS),ts=['name','age','qname','toy','qage','iage','qtoy','mytoy'];return ts.map((t,i)=>{const k=ks[i%6],q=t[0]==='q'&&t.length>2&&t!=='qq';
 if(t==='qname'||t==='qage'||t==='qtoy'){const tt=t.slice(1);return {k,text:QT[tt](k.g),ru:QR[tt](k.g),audio:`q_${tt}_${k.g}`}}
 return {k,text:T(k,t),ru:R(k,t),audio:`${k.id}_${t}`}})};
function drawBuild(r,box,api){const words=r.text.split(' ');
 box.innerHTML='<p class="hint">Послушай и собери предложение. Нажимай на слова по порядку.</p>'+scene(r.k)+'<div style="text-align:center"><button class="snd" id="ls" aria-label="слушать" style="width:60px;height:60px;font-size:28px">🔊</button></div><div class="line"></div><div class="tiles"></div>';
 const ls=box.querySelector('#ls'),line=box.querySelector('.line'),tiles=box.querySelector('.tiles');ls.onclick=()=>play(r.audio,ls);setTimeout(()=>play(r.audio,ls),350);let locked=false;
 const check=()=>{if(tiles.children.length)return;const got=[...line.children].map(x=>x.dataset.w).join(' ');
  if(got===r.text){locked=true;line.innerHTML=`<div class="sent" style="margin:0">${col(r.text)}</div>`;api.right(`Верно! ${r.text} — ${r.ru}`,[r.audio])}
  else api.wrong('Слова стоят не так. Нажми на слово в рамке — оно вернётся. Послушай ещё раз 🔊.')};
 shuf(words.map((w,i)=>({w,i}))).forEach(({w})=>{const b=h(`<button class="tile">${col(w)}</button>`);b.dataset.w=w;
  b.onclick=()=>{if(locked)return;(b.parentNode===tiles?line:tiles).append(b);check()};tiles.append(b)})}
// --- 7. speak
function speak(sel){stop();setT('Говори');const k=sel&&sel.id?sel:shuf(KIDS)[0];
 app.innerHTML='<div class="blk"><h3>🙋 Про тебя: <b class="i">I · my</b></h3><p class="hint">Послушай вопрос и ответь вслух.</p></div><div class="blk"></div>';
 const [b1,b2]=app.children;
 [['name',"My name's …"],['age',"I'm …"],['toy',"My favourite toy's my …"]].forEach(([t,st])=>{b1.append(phrow(`q_${t}_y`,QT[t]('y'),QR[t]('y'),1),h(`<div class="sent" style="font-size:24px;margin:2px 0 12px">${col(st)}</div>`))});
 b2.innerHTML=`<h3>👉 Про друга: ${M(k)?'<b class="m">he · his</b>':'<b class="f">she · her</b>'}</h3><p class="hint">Послушай вопрос. Ответь вслух. Потом нажми «Проверить».</p>`+scene(k);
 ['name','age','toy'].forEach(t=>{b2.append(phrow(`q_${t}_${k.g}`,QT[t](k.g),QR[t](k.g),1));const c=h('<button class="all" style="margin:2px 0 12px">Проверить ✓</button>');
  c.onclick=()=>{const r=phrow(`${k.id}_${t}`,T(k,t),R(k,t));c.replaceWith(r);play(`${k.id}_${t}`,r.firstChild)};b2.append(c)});
 const o=h('<button class="next">Другой друг 🔄</button>');o.onclick=()=>speak(shuf(KIDS.filter(x=>x!==k))[0]);b2.append(o)}
menu();
</script>
</body>
